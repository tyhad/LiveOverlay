<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Control Panel — LiveOverlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #1e2124;
    --panel: #1e2124;
    --panel-2: #282c30;
    --border: #282c30;
    --indigo: #7b8472;
    --indigo-2: #8e9884;
    --text: #ffffff;
    --text-dim: #c2c6be;
    --danger: #ff2357;
    --ok: #10b981;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  body {
    padding: max(12px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom));
    padding-top: calc(max(12px, env(safe-area-inset-top)));
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 8px;
  }
  header h1 {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.02em;
    margin: 0;
    color: #fff;
  }
  header h1 span { color: var(--indigo-2); }
  #status-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
    transition: background 0.2s;
  }
  #status-dot.live { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  #status-dot.err { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

  main { display: flex; flex-direction: column; gap: 16px; max-width: 720px; margin: 0 auto; }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 40px 16px;
    border: 1px dashed var(--border);
    border-radius: 14px;
  }

  section.group {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
  }
  .group-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 10px 2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .group-title .kind {
    font-size: 10px;
    font-weight: 600;
    text-transform: none;
    letter-spacing: normal;
    background: var(--panel-2);
    border-radius: 999px;
    padding: 2px 8px;
    color: var(--indigo-2);
  }

  /* Counter */
  .counter-row {
    display: grid;
    grid-template-columns: 72px 1fr 72px;
    align-items: stretch;
    gap: 10px;
  }
  .counter-btn {
    font-size: 30px;
    font-weight: 800;
    border: none;
    border-radius: 14px;
    background: var(--panel-2);
    color: #fff;
    cursor: pointer;
    touch-action: manipulation;
    min-height: 76px;
  }
  .counter-btn:active { transform: scale(0.94); background: var(--indigo); }
  .counter-btn.dec:active { background: var(--danger); }
  .counter-value {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: #fff;
    line-height: 1;
  }
  .counter-value small {
    margin-top: 4px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .reset-btn {
    margin-top: 8px;
    width: 100%;
    padding: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 999px;
    cursor: pointer;
  }
  .reset-btn:active { background: var(--panel-2); color: var(--text); }

  /* Event state pills */
  .pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .pill {
    flex: 1 1 auto;
    min-width: 72px;
    padding: 14px 10px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text-dim);
    cursor: pointer;
    touch-action: manipulation;
  }
  .pill.active {
    background: var(--indigo);
    border-color: var(--indigo-2);
    color: #fff;
    box-shadow: 0 0 0 2px rgba(98, 95, 255, 0.35);
  }
  .pill:active { transform: scale(0.96); }
  .pill-wrap { position: relative; flex: 1 1 auto; min-width: 72px; display: flex; }
  .pill-wrap .pill { flex: 1; }
  .pill-wrap.managing { flex-direction: column; gap: 4px; }
  .pill-tools { display: flex; gap: 4px; align-items: center; justify-content: center; }
  .color-tool {
    display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text-dim);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px 2px 4px; cursor: pointer;
  }
  .color-tool input { width: 22px; height: 22px; padding: 0; border: none; background: transparent; cursor: pointer; }
  .tool-btn {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text-dim); font-size: 12px; cursor: pointer; line-height: 1;
  }
  .tool-btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .color-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; border: 1px solid rgba(255,255,255,.4); vertical-align: middle; }
  .pill-remove {
    position: absolute; top: -6px; right: -4px;
    width: 22px; height: 22px; border-radius: 50%;
    border: none; background: var(--danger); color: #fff;
    font-size: 11px; font-weight: 800; cursor: pointer; line-height: 1;
  }
  .manage-btn {
    font-size: 10px; font-weight: 700; text-transform: none; letter-spacing: normal;
    padding: 2px 10px; border-radius: 999px; cursor: pointer;
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  }
  .manage-btn.on { background: var(--indigo); border-color: var(--indigo-2); color: #fff; }
  .add-option-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-option-row input {
    flex: 1; min-width: 0; padding: 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 13px; user-select: text;
  }
  .add-option-row button {
    padding: 10px 14px; border-radius: 10px; border: none;
    background: var(--indigo); color: #fff; font-weight: 700; cursor: pointer;
  }

  /* Timer (placeholder UI — backend penuh menyusul di #5) */
  .timer-display {
    text-align: center;
    font-size: 44px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: #fff;
    margin-bottom: 10px;
  }
  .timer-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .timer-controls button {
    flex: 1;
    padding: 12px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 12px;
    border: none;
    background: var(--panel-2);
    color: #fff;
    cursor: pointer;
  }
  .timer-controls button.start { background: var(--ok); }
  .timer-controls button.stop { background: var(--danger); }
  .timer-manual {
    display: flex;
    gap: 8px;
  }
  .timer-manual input {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13px;
  }
  .timer-manual button {
    padding: 10px 14px;
    border-radius: 10px;
    border: none;
    background: var(--indigo);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  .timer-note {
    margin-top: 8px;
    font-size: 10px;
    color: var(--text-dim);
    line-height: 1.4;
  }
  .timer-manual input.invalid { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(255,35,87,.3); }
  .text-input {
    width: 100%; padding: 10px; border-radius: 10px; resize: vertical; min-height: 72px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 14px; font-family: inherit; line-height: 1.4; user-select: text;
  }
  .text-actions { display: flex; gap: 8px; margin-top: 8px; }
  .text-send {
    flex: 1; padding: 12px; border: none; border-radius: 12px; font-weight: 700; font-size: 13px;
    background: var(--panel-2); color: #fff; cursor: pointer;
  }
  .text-send.dirty { background: var(--ok); }
  .text-clear {
    padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
    background: transparent; color: var(--text-dim); font-weight: 700; font-size: 12px; cursor: pointer;
  }
  .text-status { margin-top: 6px; font-size: 10px; color: var(--text-dim); }
  .timer-mode-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .mode-btn {
    flex: 1;
    padding: 8px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
  }
  .mode-btn.active {
    background: var(--indigo);
    border-color: var(--indigo-2);
    color: #fff;
  }
  .timer-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .timer-toggle input { width: 16px; height: 16px; }

  /* Chat Archive */
  .hidden { display: none !important; }
  .archive-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    max-width: 720px;
    margin: 0 auto 16px;
  }
  .archive-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .archive-head h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .archive-sub { margin: 3px 0 0; font-size: 11px; color: var(--text-dim); }
  .archive-active {
    font-size: 12px;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 10px;
  }
  .archive-active b { color: var(--text); }
  .archive-label-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .archive-label {
    margin-right: auto;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }
  .archive-sessions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 190px;
    overflow: auto;
  }
  .session-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
  }
  .session-item.selected { border-color: var(--indigo-2); box-shadow: 0 0 0 2px rgba(142,152,132,.25); }
  .session-item small { color: var(--text-dim); font-size: 10px; }
  .session-item .session-badge {
    font-size: 9px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
    color: var(--text-dim);
    white-space: nowrap;
  }
  .session-item .session-badge.active { background: rgba(16,185,129,.18); color: var(--ok); }
  .session-item .session-badge.interrupted { background: rgba(255,35,87,.16); color: var(--danger); }
  .archive-details { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; }
  .archive-details summary {
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .archive-details summary::-webkit-details-marker { display: none; }
  .archive-details[open] summary { color: var(--text); margin-bottom: 10px; }
  .archive-selected { font-size: 10px; color: var(--indigo-2); font-weight: 600; }
  .archive-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  .archive-field label {
    display: block;
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .archive-field input,
  .archive-field select {
    width: 100%;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
  }
  .archive-field.archive-check { display: flex; align-items: flex-end; }
  .archive-field.archive-check label { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text); margin: 0 0 7px; }
  .archive-field.archive-check input { width: 16px; height: 16px; padding: 0; }
  .archive-actions { display: flex; gap: 8px; margin-top: 10px; }
  .archive-btn {
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .archive-btn.primary { background: var(--indigo); border-color: var(--indigo-2); }
  .archive-btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .archive-btn:disabled { opacity: .45; cursor: not-allowed; }
  .archive-btn:active:not(:disabled) { transform: scale(.97); }
  .archive-preview {
    margin: 10px 0 0;
    min-height: 58px;
    max-height: 220px;
    overflow: auto;
    white-space: pre-wrap;
    font-size: 11px;
    line-height: 1.45;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 10px;
  }
  .archive-align-row { display: flex; gap: 8px; margin-top: 8px; }
  .archive-align-row input {
    flex: 1; min-width: 0; padding: 9px 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 12px; font-family: inherit;
  }
  .archive-align-row button {
    padding: 9px 12px; border-radius: 10px; border: none;
    background: var(--indigo); color: #fff; font-size: 11px; font-weight: 700; cursor: pointer;
  }
  .archive-status { margin: 8px 0 0; font-size: 11px; color: var(--text-dim); }
  @media (max-width: 520px) {
    .archive-grid { grid-template-columns: 1fr; }
  }
</style>

<body class="control-page">
  <header>
    <h1>Control <span>Panel</span></h1>
    <div id="status-dot" title="Sinkronisasi control-state"></div>
  </header>

  <!-- Panel arsip sengaja DI LUAR #app: render() control-state berjalan tiap detik
       dan tidak boleh menghapus form/daftar sesi yang sedang dipakai. -->
  <section id="chat-archive-panel" class="archive-panel hidden">
    <div class="archive-head">
      <div>
        <h2>Chat Archive</h2>
        <p class="archive-sub">Rekaman chat per sesi dan export subtitle (SRT/VTT/CSV/JSON).</p>
      </div>
      <button id="archive-refresh-btn" class="archive-btn" title="Muat ulang daftar sesi">↻</button>
    </div>

    <div id="archive-active-summary" class="archive-active">Memuat sesi arsip…</div>

    <div class="archive-label-row">
      <span class="archive-label">Daftar sesi</span>
      <button id="archive-new-btn" class="archive-btn primary">Sesi baru</button>
      <button id="archive-end-btn" class="archive-btn danger hidden">End session aktif</button>
      <button id="archive-delete-btn" class="archive-btn danger" disabled>Hapus sesi</button>
    </div>
    <div id="archive-sessions" class="archive-sessions">
      <div class="archive-status">Memuat…</div>
    </div>

    <details class="archive-details" open>
      <summary>
        <span>Export</span>
        <span id="archive-selected-label" class="archive-selected">—</span>
      </summary>
      <div class="archive-grid">
        <div class="archive-field">
          <label for="archive-format">Format</label>
          <select id="archive-format">
            <option value="srt">SRT</option>
            <option value="vtt">VTT</option>
            <option value="csv">CSV</option>
            <option value="json">JSON</option>
          </select>
        </div>
        <div class="archive-field">
          <label for="archive-offset">Offset (detik)</label>
          <input id="archive-offset" type="number" step="0.1" value="0" />
        </div>
        <div class="archive-field">
          <label for="archive-mode">Mode</label>
          <select id="archive-mode">
            <option value="stack">Stack (N baris)</option>
            <option value="single">Single (1 chat/cue)</option>
          </select>
        </div>
        <div class="archive-field">
          <label for="archive-lines">Lines</label>
          <input id="archive-lines" type="number" min="1" max="30" step="1" value="5" />
        </div>
        <div class="archive-field">
          <label for="archive-ttl">TTL per chat (detik)</label>
          <input id="archive-ttl" type="number" min="1" max="120" step="1" value="8" />
        </div>
        <div class="archive-field archive-check">
          <label><input id="archive-tags" type="checkbox" checked /> Tag [TT] / [YT]</label>
        </div>
      </div>
      <div class="archive-actions">
        <button id="archive-preview-btn" class="archive-btn">Preview 3 cue</button>
        <button id="archive-download-btn" class="archive-btn primary">Download</button>
      </div>
      <pre id="archive-preview" class="archive-preview">Pilih sesi lalu klik “Preview 3 cue”.</pre>
    </details>

    <details class="archive-details">
      <summary>Samakan dengan chat</summary>
      <div class="archive-field">
        <label for="archive-align-chat">Chat yang muncul di video</label>
        <select id="archive-align-chat"></select>
      </div>
      <div class="archive-align-row">
        <input id="archive-align-time" type="text" inputmode="numeric" placeholder="Waktu di video, mis. 12:34" />
        <button id="archive-align-btn">Hitung offset</button>
      </div>
      <p class="archive-status" id="archive-align-status">Offset hasil hitungan otomatis masuk ke kolom Offset di
        atas.</p>
    </details>
  </section>

  <main id="app">
    <div class="empty-state">Memuat binding dari scene…</div>
  </main>

  <script src="/text-binding.js"></script>
  <script>
    const { computeTimerDisplayMs, formatTimerMs } = window.TextBinding
    const nativeFetch = window.fetch.bind(window)
    window.fetch = async (input, init = {}) => {
      const response = await nativeFetch(input, init)
      // Archive GET endpoints are also protected (they contain viewer usernames).
      if (response.status !== 401 || !String(input).includes('/api/')) return response

      const token = sessionStorage.getItem('liveoverlay-secret') || window.prompt('Masukkan secret key LiveOverlay')
      if (!token) return response
      sessionStorage.setItem('liveoverlay-secret', token)
      const headers = new Headers(init.headers || (input instanceof Request ? input.headers : undefined))
      headers.set('X-Secret-Token', token)
      const retry = await nativeFetch(input, { ...init, headers })
      if (retry.status === 401) sessionStorage.removeItem('liveoverlay-secret')
      return retry
    }

    const POLL_MS = 1000
    let controlState = { counters: {}, eventStates: {} }
    let usedGroups = { counters: new Set(), eventStates: new Set(), timers: new Set(), texts: new Set() }
    let scanned = false

    function setStatus(ok) {
      const dot = document.getElementById('status-dot')
      dot.classList.remove('live', 'err')
      dot.classList.add(ok ? 'live' : 'err')
    }

    /** Scan semua scene, kumpulkan nama grup unik dari textBinding/stateBinding
     *  dengan source 'counter' atau 'eventState' — supaya section muncul otomatis di
     *  Control Panel begitu ada binding baru dibuat di Editor, tanpa setup ganda. */
    async function scanUsedGroups() {
      const counters = new Set()
      const eventStates = new Set()
      const timers = new Set()
      const texts = new Set()
      let chatNotif = false
      try {
        const res = await fetch('/api/scenes')
        if (!res.ok) return { counters, eventStates, timers, texts, chatNotif }
        const data = await res.json()
        const scenes = Array.isArray(data.scenes) ? data.scenes : []
        scenes.forEach(scene => {
          (scene.elements || []).forEach(el => {
            const tb = el.textBinding
            if (tb?.source === 'counter' && (tb.group || tb.name)) counters.add(tb.group || tb.name)
            if (tb?.source === 'eventState' && tb.group) eventStates.add(tb.group)
            if (tb?.source === 'timer' && tb.group) timers.add(tb.group)
            if (tb?.source === 'text' && tb.group) texts.add(tb.group)
            const sb = el.stateBinding
            if (sb?.source === 'counter' && sb.group) counters.add(sb.group)
            if (sb?.source === 'eventState' && sb.group) eventStates.add(sb.group)
            if (sb?.enabled && sb.source === 'chatNotif') chatNotif = true
          })
        })
      } catch (err) {
        console.error('Failed to scan scenes for control groups:', err)
      }
      return { counters, eventStates, timers, texts, chatNotif }
    }

    async function syncControlState() {
      try {
        const res = await fetch('/api/control-state')
        if (!res.ok) throw new Error('bad status')
        controlState = await res.json()
        setStatus(true)
        render()
      } catch (err) {
        setStatus(false)
      }
    }
    async function callApi(path, body) {
      try {
        const res = await fetch(path, {
          method: 'POST',
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        })
        if (res.ok) {
          controlState = (await res.json()).data
          render()
        }
      } catch (err) {
        console.error('Control action failed:', err)
      }
    }

    function incCounter(name) { callApi(`/api/control-state/counters/${encodeURIComponent(name)}/inc`) }
    function decCounter(name) { callApi(`/api/control-state/counters/${encodeURIComponent(name)}/dec`) }
    function resetCounter(name) { callApi(`/api/control-state/counters/${encodeURIComponent(name)}/reset`) }
    function setEventState(group, value) { callApi(`/api/control-state/event-states/${encodeURIComponent(group)}/set`, { value }) }

    function renderCounterSection(name) {
      const counter = controlState.counters?.[name] || { value: 0, step: 1 }
      return `
        <section class="group">
          <div class="group-title"><span>${name}</span><span class="kind">Counter</span></div>
          <div class="counter-row">
            <button class="counter-btn dec" onclick="decCounter('${name}')" aria-label="Kurangi">−</button>
            <div class="counter-value">${counter.value}<small>step ${counter.step}</small></div>
            <button class="counter-btn inc" onclick="incCounter('${name}')" aria-label="Tambah">+</button>
          </div>
          <button class="reset-btn" onclick="resetCounter('${name}')">Reset ke 0</button>
        </section>
      `
    }

    function esc(v) {
      return String(v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    }
    const manageGroups = new Set() // grup event state yang sedang mode "Kelola" (tampilkan ✕ hapus opsi)

    function renderEventStateSection(group) {
      const es = controlState.eventStates?.[group] || { value: '', options: [] }
      const options = es.options.length > 0 ? es.options : (es.value ? [es.value] : [])
      const managing = manageGroups.has(group)
      const pills = options.map(opt => {
        const color = es.colors?.[opt] || ''
        return `
        <div class="pill-wrap ${managing ? 'managing' : ''}">
          <button class="pill ${opt === es.value ? 'active' : ''}" data-es-set data-group="${esc(group)}" data-option="${esc(opt)}">
            ${color ? `<span class="color-dot" style="background:${esc(color)}"></span>` : ''}${esc(opt)}
          </button>
          ${managing ? `
            <div class="pill-tools">
              <label class="color-tool" title="Warna font opsi ini">
                <input type="color" data-es-color data-group="${esc(group)}" data-option="${esc(opt)}" value="${/^#[0-9a-fA-F]{6}$/.test(color) ? color : '#ffffff'}" />
                <span>Warna</span>
              </label>
              ${color ? `<button class="tool-btn" data-es-color-clear data-group="${esc(group)}" data-option="${esc(opt)}" title="Hapus warna">⟲</button>` : ''}
              <button class="tool-btn danger" data-es-remove data-group="${esc(group)}" data-option="${esc(opt)}" aria-label="Hapus opsi">✕</button>
            </div>` : ''}
        </div>
      `}).join('')
      return `
        <section class="group">
          <div class="group-title">
            <span>${esc(group)}</span>
            <span style="display:flex;gap:6px;align-items:center;">
              <button class="manage-btn ${managing ? 'on' : ''}" data-es-manage data-group="${esc(group)}">${managing ? 'Selesai' : 'Kelola'}</button>
              <span class="kind">Event State</span>
            </span>
          </div>
          <div class="pill-row">${pills || '<span style="color:var(--text-dim);font-size:12px;">Belum ada opsi — tambah di bawah.</span>'}</div>
          <div class="add-option-row">
            <input id="add-option-${esc(group)}" data-es-input data-group="${esc(group)}" type="text" placeholder="Tambah opsi (mis. green)" autocomplete="off" />
            <button data-es-add data-group="${esc(group)}">Tambah</button>
          </div>
        </section>
      `
    }

    async function addEventStateOptionFromInput(group) {
      const input = document.getElementById(`add-option-${group}`)
      const option = input ? input.value.trim() : ''
      if (!option) return
      if (input) input.value = ''
      await callApi(`/api/control-state/event-states/${encodeURIComponent(group)}/options/add`, { option })
    }

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('button')
      if (!btn) return
      const group = btn.dataset.group
      if (btn.hasAttribute('data-es-set')) setEventState(group, btn.dataset.option)
      else if (btn.hasAttribute('data-es-add')) addEventStateOptionFromInput(group)
      else if (btn.hasAttribute('data-es-color-clear')) {
        callApi(`/api/control-state/event-states/${encodeURIComponent(group)}/options/color`, { option: btn.dataset.option, color: '' })
      } else if (btn.hasAttribute('data-es-remove')) {
        callApi(`/api/control-state/event-states/${encodeURIComponent(group)}/options/remove`, { option: btn.dataset.option })
      } else if (btn.hasAttribute('data-es-manage')) {
        manageGroups.has(group) ? manageGroups.delete(group) : manageGroups.add(group)
        render()
      }
    })
    // 'change' (bukan 'input') supaya request cuma terkirim sekali saat picker warna ditutup
    document.addEventListener('change', (e) => {
      const inp = e.target
      if (inp.matches && inp.matches('[data-es-color]')) {
        callApi(`/api/control-state/event-states/${encodeURIComponent(inp.dataset.group)}/options/color`, { option: inp.dataset.option, color: inp.value })
      }
    })
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.matches('[data-es-input]')) addEventStateOptionFromInput(e.target.dataset.group)
    })

    // Timer (Countdown & Count Up) — real, tersinkron ke server via control-state.json.
    // Elapsed dihitung live di sini dari checkpoint server (startedAtMs/pausedAccumMs),
    // di-tick tiap 250ms lokal (setInterval) supaya display mulus di antara poll 1 detik,
    // tanpa perlu polling super cepat ke server.
    let timerTickHandle = null

    /** Parse durasi ketikan manual. Format:
     *   "50"       -> 50 menit (angka polos = menit, kompatibel dengan versi lama)
     *   "05:30"    -> mm:ss   (5 menit 30 detik)
     *   "01:00:00" -> hh:mm:ss (1 jam)
     *   "1:02:03.5"-> detik boleh desimal
     * Jumlah tanda ':' menentukan arti: 1 = mm:ss, 2 = hh:mm:ss. Return ms, atau null kalau tidak valid. */
    function parseDurationInput(raw) {
      const text = String(raw ?? '').trim().replace(',', '.')
      if (!text) return null
      const parts = text.split(':')
      if (parts.length > 3) return null
      if (!parts.every(p => /^\d+(\.\d+)?$/.test(p.trim()))) return null
      const nums = parts.map(p => Number(p))
      let seconds
      if (nums.length === 1) seconds = nums[0] * 60
      else if (nums.length === 2) seconds = nums[0] * 60 + nums[1]
      else seconds = nums[0] * 3600 + nums[1] * 60 + nums[2]
      if (!Number.isFinite(seconds) || seconds <= 0) return null
      return Math.round(seconds * 1000)
    }

    /** ms -> "mm:ss" atau "hh:mm:ss" (kalau >= 1 jam) untuk ditampilkan di input durasi. */
    function formatDurationInput(ms) {
      const total = Math.round((ms || 0) / 1000)
      if (total <= 0) return ''
      const h = Math.floor(total / 3600)
      const m = Math.floor((total % 3600) / 60)
      const sec = total % 60
      const pad = (n) => String(n).padStart(2, '0')
      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`
    }

    function startTimer(name, restart = false) {
      const durationInput = document.getElementById(`timer-duration-${name}`)
      const mode = timerPendingMode[name] || 'countdown'
      const body = { mode }
      if (restart) body.restart = true
      if (mode === 'countdown') {
        const durationMs = parseDurationInput(durationInput ? durationInput.value : '')
        if (durationMs === null) {
          if (durationInput) {
            durationInput.classList.add('invalid')
            durationInput.focus()
          }
          return
        }
        if (durationInput) durationInput.classList.remove('invalid')
        body.durationMs = durationMs
      }
      callApi(`/api/control-state/timers/${encodeURIComponent(name)}/start`, body)
    }
    function pauseTimer(name) { callApi(`/api/control-state/timers/${encodeURIComponent(name)}/pause`) }
    function resetTimer(name) { callApi(`/api/control-state/timers/${encodeURIComponent(name)}/reset`) }
    function toggleContinueBelowZero(name, checked) {
      callApi(`/api/control-state/timers/${encodeURIComponent(name)}/configure`, { continueBelowZero: checked })
    }
    const timerPendingMode = {}
    function setTimerMode(name, mode) {
      timerPendingMode[name] = mode
      callApi(`/api/control-state/timers/${encodeURIComponent(name)}/configure`, { mode })
    }

    function renderTimerSection(name) {
      const timer = controlState.timers?.[name] || {
        mode: 'countdown', durationMs: 0, startedAtMs: null, pausedAccumMs: 0, isRunning: false, continueBelowZero: false,
      }
      timerPendingMode[name] = timerPendingMode[name] || timer.mode
      const durationText = formatDurationInput(timer.durationMs)
      const startLabel = timer.isRunning ? 'Restart' : (timer.pausedAccumMs > 0 ? 'Resume' : 'Start')
      return `
        <section class="group">
          <div class="group-title"><span>${name}</span><span class="kind">Timer</span></div>
          <div class="timer-mode-row">
            <button class="mode-btn ${timer.mode === 'countdown' ? 'active' : ''}" onclick="setTimerMode('${name}', 'countdown')">Countdown</button>
            <button class="mode-btn ${timer.mode === 'countup' ? 'active' : ''}" onclick="setTimerMode('${name}', 'countup')">Count Up</button>
          </div>
          <div class="timer-display" data-timer-name="${name}"></div>
          <div class="timer-controls">
            <button class="start" onclick="startTimer('${name}', ${timer.isRunning})">${startLabel}</button>
            <button onclick="pauseTimer('${name}')">Pause</button>
            <button class="stop" onclick="resetTimer('${name}')">Reset</button>
          </div>
          ${timer.mode === 'countdown' ? `
            <div class="timer-manual">
              <input id="timer-duration-${name}" type="text" autocomplete="off" placeholder="Durasi mm:ss atau hh:mm:ss (mis. 10:00 / 01:00:00)" value="${esc(durationText)}" />
            </div>
            <label class="timer-toggle">
              <input type="checkbox" ${timer.continueBelowZero ? 'checked' : ''} onchange="toggleContinueBelowZero('${name}', this.checked)" />
              Lanjut ke minus setelah 0
            </label>
          ` : ''}
        </section>
      `
    }

    // Teks bebas (single/multiline). Draft disimpan lokal selama user mengetik supaya
    // re-render poll 1 detik tidak menimpa ketikan; baru dikirim ke server saat Kirim.
    const textDrafts = {}

    function renderTextSection(name) {
      const serverValue = controlState.texts?.[name]?.value ?? ''
      const hasDraft = Object.prototype.hasOwnProperty.call(textDrafts, name)
      const draft = hasDraft ? textDrafts[name] : serverValue
      const dirty = hasDraft && textDrafts[name] !== serverValue
      const lines = serverValue ? serverValue.split('\n').length : 0
      return `
        <section class="group">
          <div class="group-title"><span>${esc(name)}</span><span class="kind">Text</span></div>
          <textarea id="text-input-${esc(name)}" class="text-input" data-text-input data-name="${esc(name)}" rows="3"
            placeholder="Tulis teks… (Enter = baris baru, Ctrl+Enter = kirim)">${esc(draft)}</textarea>
          <div class="text-actions">
            <button class="text-send ${dirty ? 'dirty' : ''}" data-text-send data-name="${esc(name)}">Kirim ke overlay</button>
            <button class="text-clear" data-text-clear data-name="${esc(name)}">Kosongkan</button>
          </div>
          <div class="text-status">${dirty ? 'Ada perubahan belum dikirim' : (serverValue ? `Tayang: ${lines} baris` : 'Kosong')}</div>
        </section>
      `
    }

    async function sendText(name, value) {
      delete textDrafts[name]
      await callApi(`/api/control-state/texts/${encodeURIComponent(name)}/set`, { value })
    }

    document.addEventListener('input', (e) => {
      const ta = e.target
      if (ta.matches && ta.matches('[data-text-input]')) {
        textDrafts[ta.dataset.name] = ta.value
        const btn = document.querySelector(`[data-text-send][data-name="${CSS.escape(ta.dataset.name)}"]`)
        if (btn) btn.classList.add('dirty')
      }
    })
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.matches && e.target.matches('[data-text-input]')) {
        e.preventDefault()
        sendText(e.target.dataset.name, e.target.value)
      }
    })
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('button')
      if (!btn) return
      if (btn.hasAttribute('data-text-send')) {
        const ta = document.getElementById(`text-input-${btn.dataset.name}`)
        sendText(btn.dataset.name, ta ? ta.value : '')
      } else if (btn.hasAttribute('data-text-clear')) {
        sendText(btn.dataset.name, '')
      }
    })

    function updateTimerDisplays() {
      document.querySelectorAll('[data-timer-name]').forEach(node => {
        const name = node.dataset.timerName
        const timer = controlState.timers?.[name]
        node.textContent = formatTimerMs(computeTimerDisplayMs(timer))
      })
    }

    function render() {
      const app = document.getElementById('app')
      const counterNames = [...usedGroups.counters].sort()
      const eventGroups = [...usedGroups.eventStates].sort()
      const timerGroups = [...usedGroups.timers].sort()
      const textGroups = [...usedGroups.texts].sort()

      if (!scanned) {
        app.innerHTML = '<div class="empty-state">Memuat binding dari scene…</div>'
        return
      }

      if (counterNames.length === 0 && eventGroups.length === 0 && timerGroups.length === 0 && textGroups.length === 0) {
        app.innerHTML = `
          <div class="empty-state">
            Belum ada Counter, Event State, Timer, atau Text yang dipakai.<br/>
            Buat binding baru (source: Control Panel → Counter / Event State / Timer / Text) di Editor — section-nya bakal otomatis muncul di sini.
          </div>
        `
        return
      }

      // Jangan re-render saat picker warna sedang fokus (bisa menutup picker native).
      const ae = document.activeElement
      if (ae && ae.matches && ae.matches('input[type="color"], textarea') && app.contains(ae)) return

      // Poll 1 detik me-render ulang seluruh #app; simpan isi input + fokus supaya
      // ketikan user (mis. nama opsi / durasi) tidak hilang.
      const saved = {}
      app.querySelectorAll('input[id]').forEach(inp => {
        saved[inp.id] = inp.type === 'checkbox' ? inp.checked : inp.value
      })
      const focusedId = document.activeElement && app.contains(document.activeElement) ? document.activeElement.id : null
      const selStart = focusedId ? document.activeElement.selectionStart : null

      const html = [
        ...counterNames.map(renderCounterSection),
        ...eventGroups.map(renderEventStateSection),
        ...timerGroups.map(renderTimerSection),
        ...textGroups.map(renderTextSection),
      ].join('')
      if (html === app.dataset.lastHtml) return
      app.dataset.lastHtml = html
      app.innerHTML = html
      updateTimerDisplays()

      Object.entries(saved).forEach(([id, val]) => {
        const inp = document.getElementById(id)
        if (!inp) return
        if (inp.type === 'checkbox') return // checkbox mengikuti state server
        if (id.startsWith('add-option-') || document.activeElement?.id === id || val !== '') inp.value = val
      })
      if (focusedId) {
        const inp = document.getElementById(focusedId)
        if (inp) {
          inp.focus()
          if (selStart !== null && inp.setSelectionRange && inp.type !== 'number') inp.setSelectionRange(selStart, selStart)
        }
      }
    }

    // ─── Chat Archive panel ─────────────────────────────────────────────────
    const archiveState = { sessions: [], selectedId: null, activeId: null, followActive: true, deferredActiveId: null }
    let archiveChats = []

    function formatBytes(bytes) {
      const n = Number(bytes) || 0
      if (n < 1024) return `${n} B`
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`
      return `${(n / (1024 * 1024)).toFixed(2)} MB`
    }

    function archiveSelectedSession() {
      return archiveState.sessions.find(s => s.id === archiveState.selectedId) || null
    }

    function updateArchiveSessionUI() {
      const active = archiveState.sessions.find(s => s.isActive) || null
      archiveState.activeId = active ? active.id : null

      const summary = document.getElementById('archive-active-summary')
      if (summary) {
        summary.innerHTML = active
          ? `Sesi aktif: <b>${esc(active.id)}</b> · ${active.chatCount.toLocaleString()} chat · ${formatBytes(active.bytes)}`
          : 'Tidak ada sesi aktif. Chat baru akan otomatis membuka sesi berikutnya.'
      }

      const endBtn = document.getElementById('archive-end-btn')
      if (endBtn) endBtn.classList.toggle('hidden', !active)

      const deleteBtn = document.getElementById('archive-delete-btn')
      if (deleteBtn) {
        const selected = archiveSelectedSession()
        deleteBtn.disabled = !selected || Boolean(selected.isActive)
      }

      const label = document.getElementById('archive-selected-label')
      if (label) label.textContent = archiveState.selectedId || '—'
    }

    function renderArchiveSessions() {
      const container = document.getElementById('archive-sessions')
      if (!container) return
      if (archiveState.sessions.length === 0) {
        container.innerHTML = '<div class="archive-status">Belum ada sesi arsip.</div>'
      } else {
        container.innerHTML = archiveState.sessions.map(session => {
          const started = new Date(session.startedAt).toLocaleString()
          const badge = session.isActive ? 'aktif' : session.interrupted ? 'interrupted' : 'selesai'
          const badgeClass = session.isActive ? 'active' : session.interrupted ? 'interrupted' : ''
          return `
            <button class="session-item ${session.id === archiveState.selectedId ? 'selected' : ''}"
              data-archive-session="${esc(session.id)}">
              <span>
                <b>${esc(session.id)}</b><br/>
                <small>${esc(started)} · ${session.chatCount.toLocaleString()} chat · ${formatBytes(session.bytes)}</small>
              </span>
              <span class="session-badge ${badgeClass}">${badge}</span>
            </button>`
        }).join('')
      }
      updateArchiveSessionUI()
    }

    async function loadArchiveChats() {
      const select = document.getElementById('archive-align-chat')
      if (!select) return
      const session = archiveSelectedSession()
      if (!session) {
        archiveChats = []
        select.innerHTML = '<option value="">Pilih sesi dulu</option>'
        return
      }
      try {
        const res = await fetch(`/api/chat/archive/${encodeURIComponent(session.id)}/chats?limit=500&offset=0`)
        if (!res.ok) throw new Error('gagal memuat chat')
        const data = await res.json()
        const previousValue = select.value
        archiveChats = Array.isArray(data.chats) ? data.chats : []
        select.innerHTML = archiveChats.length === 0
          ? '<option value="">Sesi ini belum punya chat</option>'
          : archiveChats.map(chat => {
              const text = `${chat.author}: ${chat.message}`.replace(/\s+/g, ' ').slice(0, 80)
              const platform = String(chat.platform || '').toUpperCase()
              return `<option value="${chat.seq}">#${chat.seq} [${esc(platform)}] ${esc(text)}</option>`
            }).join('')
        // Keep the chat the user picked while new chats arrive every refresh.
        if (previousValue && archiveChats.some(chat => String(chat.seq) === previousValue)) {
          select.value = previousValue
        }
        const status = document.getElementById('archive-align-status')
        if (status && Number(data.total) > archiveChats.length) {
          status.textContent = `Menampilkan ${archiveChats.length} dari ${data.total} chat pertama.`
        }
      } catch (err) {
        select.innerHTML = '<option value="">Gagal memuat chat</option>'
      }
    }

    async function selectArchiveSession(id) {
      archiveState.selectedId = id || null
      archiveState.deferredActiveId = null
      archiveState.followActive = Boolean(archiveState.sessions.find(s => s.id === id)?.isActive)
      renderArchiveSessions()
      const preview = document.getElementById('archive-preview')
      if (preview) preview.textContent = 'Pilih sesi lalu klik “Preview 3 cue”.'
      const status = document.getElementById('archive-align-status')
      if (status) {
        status.textContent = 'Offset hasil hitungan otomatis masuk ke kolom Offset di atas.'
      }
      await loadArchiveChats()
    }

    async function loadArchiveSessions() {
      const container = document.getElementById('archive-sessions')
      try {
        const res = await fetch('/api/chat/archive')
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        const data = await res.json()
        archiveState.sessions = Array.isArray(data.sessions) ? data.sessions : []
        const active = archiveState.sessions.find(s => s.isActive)
        const previousActiveId = archiveState.activeId

        // Follow the active session, but keep the previous one selected for one
        // refresh cycle so chats archived right before the rollover are shown first.
        if (archiveState.deferredActiveId) {
          archiveState.selectedId = archiveState.deferredActiveId
          archiveState.deferredActiveId = null
        } else if (archiveState.followActive && active) {
          const rolledOver = previousActiveId && previousActiveId !== active.id
          if (rolledOver && archiveState.selectedId === previousActiveId) {
            archiveState.deferredActiveId = active.id
          } else {
            archiveState.selectedId = active.id
          }
        }
        if (!archiveState.sessions.some(s => s.id === archiveState.selectedId)) {
          archiveState.selectedId = active ? active.id : (archiveState.sessions[0]?.id || null)
          archiveState.deferredActiveId = null
        }

        renderArchiveSessions()
        // Refresh the chat list too: chats archived since the last poll must show
        // before the panel moves on to a newer session.
        await loadArchiveChats()
      } catch (err) {
        if (container) container.innerHTML = `<div class="archive-status">Gagal memuat arsip: ${esc(err.message)}</div>`
      }
    }

    function archiveExportQuery(format) {
      const params = new URLSearchParams()
      params.set('format', format)
      params.set('offset', String(Number(document.getElementById('archive-offset').value) || 0))
      params.set('mode', document.getElementById('archive-mode').value === 'single' ? 'single' : 'stack')
      params.set('lines', String(Math.max(1, Math.min(30, parseInt(document.getElementById('archive-lines').value, 10) || 5))))
      params.set('ttl', String(Math.max(1, Math.min(120, parseInt(document.getElementById('archive-ttl').value, 10) || 8))))
      params.set('tags', document.getElementById('archive-tags').checked ? '1' : '0')
      return params
    }

    function previewCueText(text, format) {
      if (format === 'json') {
        try {
          const data = JSON.parse(text)
          const chats = Array.isArray(data.chats) ? data.chats : []
          if (chats.length === 0) return 'Tidak ada chat pada sesi ini.'
          return chats.slice(0, 3)
            .map(c => `t=${Number(c.t_rel_sec).toFixed(2)}s [${String(c.platform || '').toUpperCase()}] ${c.author}: ${c.message}`)
            .join('\n')
        } catch {
          return text.slice(0, 600)
        }
      }
      if (format === 'csv') {
        return text.replace(/\r/g, '').split('\n').slice(0, 4).join('\n') || 'Tidak ada data CSV.'
      }
      const blocks = text.replace(/\r/g, '').split(/\n\n+/).map(b => b.trim()).filter(b => b.includes('-->'))
      if (blocks.length === 0) return 'Tidak ada cue pada rentang/offset ini.'
      return blocks.slice(0, 3).join('\n\n')
    }

    async function previewArchive() {
      const session = archiveSelectedSession()
      const preview = document.getElementById('archive-preview')
      if (!session) { if (preview) preview.textContent = 'Pilih sesi dulu.'; return }
      if (preview) preview.textContent = 'Memuat preview…'
      const format = document.getElementById('archive-format').value
      const params = archiveExportQuery(format)
      try {
        const res = await fetch(`/api/chat/archive/${encodeURIComponent(session.id)}/export?${params.toString()}`)
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        const text = await res.text()
        if (preview) preview.textContent = previewCueText(text, format)
      } catch (err) {
        if (preview) preview.textContent = `Gagal memuat preview: ${err.message}`
      }
    }

    async function downloadArchive() {
      const session = archiveSelectedSession()
      if (!session) { alert('Pilih sesi dulu.'); return }
      const format = document.getElementById('archive-format').value
      const params = archiveExportQuery(format)
      try {
        const res = await fetch(`/api/chat/archive/${encodeURIComponent(session.id)}/export?${params.toString()}`)
        if (!res.ok) {
          let message = `HTTP ${res.status}`
          try { message = (await res.json()).message || message } catch {}
          throw new Error(message)
        }
        const blob = await res.blob()
        const disposition = res.headers.get('content-disposition') || ''
        const match = /filename="?([^";]+)"?/i.exec(disposition)
        const filename = match ? match[1] : `chat-${session.id}.${format}`
        const url = URL.createObjectURL(blob)
        const link = document.createElement('a')
        link.href = url
        link.download = filename
        document.body.appendChild(link)
        link.click()
        link.remove()
        setTimeout(() => URL.revokeObjectURL(url), 1000)
      } catch (err) {
        alert(`Gagal mengunduh: ${err.message}`)
      }
    }

    async function endArchiveSession() {
      const active = archiveState.sessions.find(s => s.isActive)
      if (!active) return
      if (!window.confirm(`Akhiri sesi arsip ${active.id}? Chat berikutnya akan membuka sesi baru.`)) return
      try {
        const res = await fetch('/api/chat/archive/session/end', { method: 'POST' })
        const data = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`)
        await loadArchiveSessions()
      } catch (err) {
        alert(`Gagal mengakhiri sesi: ${err.message}`)
      }
    }

    async function startArchiveSession() {
      const active = archiveState.sessions.find(s => s.isActive)
      const question = active
        ? `Mulai sesi baru? Sesi aktif ${active.id} akan ditutup.`
        : 'Mulai sesi arsip baru?'
      if (!window.confirm(question)) return
      try {
        const res = await fetch('/api/chat/archive/session/start', { method: 'POST' })
        const data = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`)
        archiveState.selectedId = data.sessionId || null
        archiveState.followActive = true
        archiveState.deferredActiveId = null
        await loadArchiveSessions()
      } catch (err) {
        alert(`Gagal memulai sesi: ${err.message}`)
      }
    }

    async function deleteArchiveSession() {
      const session = archiveSelectedSession()
      if (!session || session.isActive) return
      if (!window.confirm(`Hapus sesi ${session.id}? Chat di dalamnya akan hilang permanen.`)) return
      try {
        const res = await fetch(`/api/chat/archive/${encodeURIComponent(session.id)}`, { method: 'DELETE' })
        const data = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`)
        archiveState.selectedId = null
        await loadArchiveSessions()
      } catch (err) {
        alert(`Gagal menghapus sesi: ${err.message}`)
      }
    }

    async function alignArchive() {
      const session = archiveSelectedSession()
      const status = document.getElementById('archive-align-status')
      if (!session) { if (status) status.textContent = 'Pilih sesi dulu.'; return }
      const chatSeq = Number(document.getElementById('archive-align-chat').value)
      const videoTime = document.getElementById('archive-align-time').value.trim()
      if (!chatSeq) { if (status) status.textContent = 'Pilih chat yang muncul di video.'; return }
      if (!videoTime) { if (status) status.textContent = 'Isi waktu kemunculan di video (mis. 12:34).'; return }
      try {
        const res = await fetch(`/api/chat/archive/${encodeURIComponent(session.id)}/align?chatSeq=${encodeURIComponent(chatSeq)}&videoTime=${encodeURIComponent(videoTime)}`)
        const data = await res.json()
        if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`)
        document.getElementById('archive-offset').value = String(data.offsetSec)
        if (status) {
          status.textContent = `Offset ${data.offsetSec}s diterapkan. Preview/download berikutnya memakai offset ini.`
        }
      } catch (err) {
        if (status) status.textContent = `Gagal menghitung offset: ${err.message}`
      }
    }

    let chatArchiveStarted = false
    function applyChatArchiveVisibility() {
      const panel = document.getElementById('chat-archive-panel')
      const visible = usedGroups.chatNotif === true
      if (panel) panel.classList.toggle('hidden', !visible)
      if (!visible || chatArchiveStarted) return
      chatArchiveStarted = true
      initChatArchive()
    }

    function initChatArchive() {
      document.getElementById('archive-refresh-btn').addEventListener('click', loadArchiveSessions)
      document.getElementById('archive-new-btn').addEventListener('click', startArchiveSession)
      document.getElementById('archive-end-btn').addEventListener('click', endArchiveSession)
      document.getElementById('archive-delete-btn').addEventListener('click', deleteArchiveSession)
      document.getElementById('archive-preview-btn').addEventListener('click', previewArchive)
      document.getElementById('archive-download-btn').addEventListener('click', downloadArchive)
      document.getElementById('archive-align-btn').addEventListener('click', alignArchive)
      document.getElementById('archive-sessions').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-archive-session]')
        if (btn) selectArchiveSession(btn.dataset.archiveSession)
      })
      document.getElementById('archive-format').addEventListener('change', () => {
        const preview = document.getElementById('archive-preview')
        if (preview) preview.textContent = 'Klik “Preview 3 cue” untuk melihat hasil format ini.'
      })
      loadArchiveSessions()
      setInterval(loadArchiveSessions, 5000)
    }

    async function init() {
      const groups = await scanUsedGroups()
      usedGroups = groups

      scanned = true
      applyChatArchiveVisibility()
      await syncControlState()
      setInterval(syncControlState, POLL_MS)
      // Tick lokal buat display timer yang sedang running, tanpa nunggu poll 1 detik
      // (spec: hitung elapsed di client, checkpoint aja yang dipoll dari server).
      setInterval(updateTimerDisplays, 250)
      // Re-scan binding usage tiap beberapa detik supaya section baru dari Editor
      // (tanpa perlu reload manual Control Panel) tetap ke-detect.
      setInterval(async () => {
        usedGroups = await scanUsedGroups()
        applyChatArchiveVisibility()
        render()
      }, 8000)
    }

    document.addEventListener('DOMContentLoaded', init)
  </script>
</body>
</html>
