<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveOverlay - Control Panel</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4 font-sans antialiased selection:bg-indigo-500 selection:text-white">
  <div class="max-w-lg w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur">
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🎛️</span>
        <div>
          <h1 class="text-xl font-bold text-white tracking-tight">LiveOverlay Control Panel</h1>
          <p class="text-xs text-slate-400">Manage stream overlay content</p>
        </div>
      </div>
      <a href="/overlay.html" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-indigo-400 hover:text-indigo-300 border border-slate-700 transition">
        <span>Open Overlay</span>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
        </svg>
      </a>
    </div>

    <form id="settings-form" class="space-y-5">
      <div>
        <label for="tiktokUsername" class="block text-sm font-medium text-slate-300 mb-1.5">
          Username TikTok
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 text-sm">@</span>
          <input
            type="text"
            id="tiktokUsername"
            name="tiktokUsername"
            placeholder="creator_username"
            class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-8 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
          >
        </div>
      </div>

      <div>
        <label for="runningText" class="block text-sm font-medium text-slate-300 mb-1.5">
          Running Text
        </label>
        <textarea
          id="runningText"
          name="runningText"
          rows="3"
          placeholder="Tulis pesan running text di sini..."
          class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition resize-none"
        ></textarea>
      </div>

      <div class="flex items-center justify-between pt-2">
        <div id="save-status" class="flex items-center space-x-1.5 text-sm font-medium opacity-0 transition-opacity duration-300 text-emerald-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          <span>Saved!</span>
        </div>

        <button
          type="submit"
          id="save-btn"
          class="px-6 py-2.5 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-medium text-sm rounded-xl shadow-lg shadow-indigo-500/25 active:scale-95 transition-all duration-150 cursor-pointer disabled:opacity-50"
        >
          Save Changes
        </button>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('settings-form')
    const usernameInput = document.getElementById('tiktokUsername')
    const textInput = document.getElementById('runningText')
    const saveStatus = document.getElementById('save-status')
    const saveBtn = document.getElementById('save-btn')

    // Load initial settings
    async function loadSettings() {
      try {
        const res = await fetch('/api/settings')
        if (res.ok) {
          const data = await res.json()
          let username = data.tiktokUsername || ''
          if (username.startsWith('@')) username = username.slice(1)
          usernameInput.value = username
          textInput.value = data.runningText || ''
        }
      } catch (err) {
        console.error('Failed to load settings:', err)
      }
    }

    // Save settings
    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      saveBtn.disabled = true
      
      const payload = {
        tiktokUsername: usernameInput.value.trim() ? `@${usernameInput.value.trim().replace(/^@+/, '')}` : '',
        runningText: textInput.value.trim()
      }

      try {
        const res = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })

        if (res.ok) {
          saveStatus.classList.remove('opacity-0')
          saveStatus.classList.add('opacity-100')
          setTimeout(() => {
            saveStatus.classList.remove('opacity-100')
            saveStatus.classList.add('opacity-0')
          }, 2500)
        }
      } catch (err) {
        console.error('Failed to save settings:', err)
      } finally {
        saveBtn.disabled = false
      }
    })

    document.addEventListener('DOMContentLoaded', loadSettings)
  </script>
</body>
</html>
