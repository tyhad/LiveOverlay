<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveOverlay - Stream Overlay Renderer</title>
  <!-- GSAP Animation Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/animation-engine.js"></script>
  <!-- Google Fonts for Stream Overlays -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Anton&family=Racing+Sans+One&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      color: #ffffff;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #overlay-viewport {
      position: relative;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      overflow: hidden;
    }

    .overlay-element {
      position: absolute;
      box-sizing: border-box;
      overflow: hidden;
      /* PERF: batasi scope kalkulasi layout & style browser ke dalam elemen ini saja,
         tidak perlu mempengaruhi/dicek ulang terhadap elemen lain di luar boundary-nya.
         Sengaja TIDAK pakai "paint" di sini, karena elemen dengan children (parent-child
         transform) butuh overflow:visible dinamis (lihat mountOrUpdate) — contain:paint
         akan memaksa clipping walau overflow:visible, jadi akan merusak fitur itu. */
      contain: layout style;
    }
  </style>
</head>

<body>
  <div id="overlay-viewport">
    <!-- Dynamic Animated Scene Elements Injected Here -->
  </div>

  <script>
    const viewport = document.getElementById('overlay-viewport')
    const overlayParams = new URLSearchParams(window.location.search)
    const overlaySceneId = overlayParams.get('scene') || overlayParams.get('id') || 'default'
    let lastSceneHash = ''
    let lastLiveStatsHash = ''
    let currentScene = null
    let liveStats = {
      platform: 'TikTok Live',
      username: '@creator',
      displayName: 'Creator Stream',
      viewerCount: 0,
      followerCount: 0,
      likeCount: 0,
      latestChatAuthor: '',
      latestChatMessage: '',
      isLive: false,
      lastUpdatedAt: '',
      chatMessages: []
    }
    let f1Data = { sessions: [], driverStandings: [], constructorStandings: [] }
    let lastF1DataHash = ''
    let displayedChat = { author: '', message: '' }
    let chatDisplayQueue = []
    let displayedChatIds = new Set()
    let chatDisplayDurationMs = 4000
    let chatDisplayTimer = null
    let isFirstStatsSync = true
    const renderedElements = new Map()

    function getSceneCanvasSize(scene) {
      return {
        width: Number(scene?.canvas?.width) || 1920,
        height: Number(scene?.canvas?.height) || 1080,
      }
    }

    function getValueAtPath(data, path) {
      if (!path) return data
      return path.split(/[.[\]]+/).filter(Boolean).reduce((curr, key) => (curr && typeof curr === 'object' ? curr[key] : undefined), data)
    }

    // PERF: cache signature terakhir supaya tidak menulis ulang style yang identik
    // tiap poll (setiap 2 detik) — style-write yang tidak berubah tetap memicu
    // reflow paksa pada seluruh viewport (dan child-nya) kalau tidak di-guard.
    let lastViewportSignature = null

    function scaleViewport() {
      const { width, height } = getSceneCanvasSize(currentScene)
      const backgroundColor = currentScene?.canvas?.backgroundColor || 'transparent'
      const windowW = window.innerWidth
      const windowH = window.innerHeight

      const signature = `${width}|${height}|${backgroundColor}|${windowW}|${windowH}`
      if (signature === lastViewportSignature) return
      lastViewportSignature = signature

      viewport.style.width = `${width}px`
      viewport.style.height = `${height}px`
      viewport.style.backgroundColor = backgroundColor

      if (windowW !== width || windowH !== height) {
        const scaleX = windowW / width
        const scaleY = windowH / height
        const scale = Math.min(scaleX, scaleY)
        viewport.style.transform = `scale(${scale})`
      } else {
        viewport.style.transform = 'none'
      }
    }

    // Animasi elemen (entrance/loop/exit lama) sekarang ditangani oleh
    // AnimationEngine (public/animation-engine.js) via animation.sequence.
    // Lihat renderScene() di bawah untuk titik integrasinya.

    function formatBoundValue(value, format) {
      if (value === undefined || value === null || value === '') return ''
      if (format === 'number') {
        const numeric = Number(value)
        return Number.isFinite(numeric) ? new Intl.NumberFormat().format(numeric) : String(value)
      }
      if (format === 'uppercase') return String(value).toUpperCase()
      if (format === 'lowercase') return String(value).toLowerCase()
      return String(value)
    }

    function getFontStack(family) {
      const base = family || 'Inter, sans-serif'
      if (base.includes('Noto Color Emoji') || base.includes('Segoe UI Emoji')) return base
      return `${base}, 'Noto Color Emoji', 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif`
    }

    const measureCtx = document.createElement('canvas').getContext('2d')

    function measureTextWidth(text, style = {}) {
      const fontSize = style.fontSize || 18
      const fontFamily = getFontStack(style.fontFamily)
      const fontWeight = style.fontWeight || 'normal'
      const letterSpacing = style.letterSpacing || 0
      measureCtx.font = `${fontWeight} ${fontSize}px ${fontFamily}`
      const base = measureCtx.measureText(text).width
      const codePointLength = Array.from(text || '').length
      const extra = letterSpacing * Math.max(0, codePointLength - 1)
      return base + extra
    }

    function ensureMarqueeTrack(node) {
      let track = node.querySelector('.marquee-track')
      if (!track) {
        node.replaceChildren()
        track = document.createElement('div')
        track.className = 'marquee-track'
        track.style.position = 'absolute'
        track.style.top = '50%'
        track.style.transform = 'translateY(-50%)'
        track.style.display = 'flex'
        track.style.whiteSpace = 'nowrap'
        track.style.willChange = 'transform'
        node.appendChild(track)
      }
      return track
    }

    function styleStaticText(textEl, el, text) {
      textEl.style.width = '100%'
      textEl.style.height = '100%'
      textEl.style.display = 'flex'
      textEl.style.alignItems = el.style?.verticalAlign === 'top' ? 'flex-start' : (el.style?.verticalAlign === 'bottom' ? 'flex-end' : 'center')
      textEl.style.fontFamily = getFontStack(el.style?.fontFamily)
      textEl.style.fontSize = `${el.style?.fontSize || 18}px`
      textEl.style.fontWeight = el.style?.fontWeight || 'normal'
      textEl.style.color = el.style?.color || '#ffffff'
      textEl.style.padding = `${el.style?.padding || 0}px`
      textEl.style.textAlign = el.style?.textAlign || 'left'
      textEl.style.textTransform = el.style?.textTransform || 'none'
      textEl.style.letterSpacing = `${el.style?.letterSpacing || 0}px`
      textEl.style.justifyContent = el.style?.textAlign === 'center' ? 'center' : (el.style?.textAlign === 'right' ? 'flex-end' : 'flex-start')
      textEl.style.whiteSpace = 'pre-wrap'
      textEl.style.tabSize = '4'
      if (el.style?.textShadowColor) {
        const tsX = el.style.textShadowOffsetX || 0
        const tsY = el.style.textShadowOffsetY || 0
        const tsBlur = el.style.textShadowBlur || 0
        textEl.style.textShadow = `${tsX}px ${tsY}px ${tsBlur}px ${el.style.textShadowColor}`
      } else {
        textEl.style.textShadow = 'none'
      }
      textEl.textContent = text
    }

    function applyMarqueeText(node, el, text) {
      const cfg = el.marquee || {}
      const speed = cfg.speed || 80
      const gap = cfg.gap ?? 60
      const style = el.style || {}
      const textWidth = measureTextWidth(text, style)

      const record = renderedElements.get(el.id)
      const sig = [text, el.width, speed, gap, style.fontSize, style.fontFamily, style.fontWeight, style.letterSpacing, style.textShadowColor, style.textShadowOffsetX, style.textShadowOffsetY, style.textShadowBlur].join('|')

      if (record && record.scrollTween) {
        record.scrollTween.kill()
        record.scrollTween = null
        record.scrollSig = null
      }

      if (record && record.marqueeSig === sig) return

      const track = ensureMarqueeTrack(node)
      track.replaceChildren()

      const unit = textWidth + gap
      // Buat salinan sebanyak yang dibutuhkan supaya container selalu penuh
      // sepanjang animasi, apapun rasio panjang teks vs lebar container.
      const copiesNeeded = Math.max(2, Math.ceil(el.width / unit) + 2)

      for (let i = 0; i < copiesNeeded; i++) {
        const span = document.createElement('span')
        span.textContent = text
        span.style.marginRight = `${gap}px`
        span.style.flexShrink = '0'
        span.style.fontFamily = getFontStack(style.fontFamily)
        span.style.fontSize = `${style.fontSize || 18}px`
        span.style.fontWeight = style.fontWeight || 'normal'
        span.style.color = style.color || '#ffffff'
        span.style.letterSpacing = `${style.letterSpacing || 0}px`
        span.style.textTransform = style.textTransform || 'none'
        if (style.textShadowColor) {
          const tsX = style.textShadowOffsetX || 0
          const tsY = style.textShadowOffsetY || 0
          const tsBlur = style.textShadowBlur || 0
          span.style.textShadow = `${tsX}px ${tsY}px ${tsBlur}px ${style.textShadowColor}`
        } else {
          span.style.textShadow = 'none'
        }
        if (i > 0) span.setAttribute('aria-hidden', 'true')
        track.appendChild(span)
      }

      gsap.killTweensOf(track)
      const duration = unit / speed
      const direction = (cfg.direction || 'rtl') === 'ltr' ? 1 : -1
      gsap.set(track, { x: 0 })
      const tween = gsap.fromTo(track, { x: 0 }, { x: direction * unit, duration, ease: 'none', repeat: -1 })

      if (record) {
        record.marqueeTween = tween; record.marqueeSig = sig
      }
    }

    function ensureScrollTrack(node) {
      let track = node.querySelector('.scroll-track')
      if (!track) {
        node.replaceChildren()
        track = document.createElement('div')
        track.className = 'scroll-track'
        track.style.position = 'absolute'
        track.style.left = '0'
        track.style.top = '0'
        track.style.width = '100%'
        track.style.display = 'flex'
        track.style.flexDirection = 'column'
        track.style.willChange = 'transform'
        node.appendChild(track)
      }
      return track
    }

    function applyScrollText(node, el, text) {
      const cfg = el.scroll || {}
      const speed = Math.max(10, cfg.speed || 80)
      const gap = Math.max(0, cfg.gap ?? 60)
      const direction = cfg.direction || 'up'
      const yoyo = !!cfg.yoyo
      const yoyoDelay = Math.max(0, cfg.yoyoDelay ?? 1)
      const style = el.style || {}

      const record = renderedElements.get(el.id)
      const sig = [text, el.width, el.height, speed, gap, direction, yoyo, yoyoDelay, style.fontSize, style.fontFamily, style.fontWeight, style.letterSpacing, style.padding, style.textAlign, style.textTransform, style.textShadowColor, style.textShadowOffsetX, style.textShadowOffsetY, style.textShadowBlur].join('|')

      if (record && record.marqueeTween) {
        record.marqueeTween.kill()
        record.marqueeTween = null
        record.marqueeSig = null
      }

      if (record && record.scrollSig === sig) return

      const track = ensureScrollTrack(node)
      track.replaceChildren()

      const createBlock = (content) => {
        const block = document.createElement('div')
        block.style.width = `${el.width}px`
        block.style.boxSizing = 'border-box'
        block.style.fontFamily = getFontStack(style.fontFamily)
        block.style.fontSize = `${style.fontSize || 18}px`
        block.style.fontWeight = style.fontWeight || 'normal'
        block.style.color = style.color || '#ffffff'
        block.style.letterSpacing = `${style.letterSpacing || 0}px`
        block.style.textTransform = style.textTransform || 'none'
        block.style.textAlign = style.textAlign || 'left'
        block.style.whiteSpace = 'pre-wrap'
        block.style.tabSize = '4'
        block.style.wordBreak = 'break-word'
        block.style.lineHeight = '1.4'
        block.style.padding = `${style.padding || 0}px`
        if (style.textShadowColor) {
          const tsX = style.textShadowOffsetX || 0
          const tsY = style.textShadowOffsetY || 0
          const tsBlur = style.textShadowBlur || 0
          block.style.textShadow = `${tsX}px ${tsY}px ${tsBlur}px ${style.textShadowColor}`
        } else {
          block.style.textShadow = 'none'
        }
        block.textContent = content
        return block
      }

      gsap.killTweensOf(track)

      if (yoyo) {
        const block = createBlock(text)
        track.appendChild(block)

        void track.offsetHeight

        const measuredHeight = Math.max(
          block.scrollHeight || 0,
          block.offsetHeight || 0,
          block.getBoundingClientRect().height || 0
        )
        const blockHeight = measuredHeight > 0 ? measuredHeight : (style.fontSize || 18) * 1.4

        // Buffer tambahan agar baris teks paling bawah + font descender tidak terpotong sama sekali (dinaikkan 4px ekstra)
        const bottomBuffer = Math.max(12, Math.ceil((style.fontSize || 18) * 0.3) + 16)

        let startY, endY
        if (blockHeight > el.height) {
          const overflow = (blockHeight - el.height) + bottomBuffer
          startY = direction === 'up' ? 0 : -overflow
          endY = direction === 'up' ? -overflow : 0
        } else {
          const space = el.height - blockHeight
          startY = direction === 'up' ? space : 0
          endY = direction === 'up' ? 0 : space
        }

        const distance = Math.abs(endY - startY)
        const duration = distance > 0 ? distance / speed : 1

        gsap.set(track, { y: startY })
        const tween = gsap.to(track, {
          y: endY,
          duration,
          ease: 'none',
          repeat: -1,
          yoyo: true,
          repeatDelay: yoyoDelay
        })

        if (record) {
          if (record.scrollTween) record.scrollTween.kill()
          record.scrollTween = tween
          if (measuredHeight > 0) {
            record.scrollSig = sig
          } else {
            record.scrollSig = null
          }
        }
      } else {
        // PERF: ukur TINGGI cuma dari 1 blok dulu (forced layout scope-nya kecil),
        // baru tambahkan sisa salinan setelahnya (tidak perlu dipaksa sinkron —
        // browser boleh lay-out itu di siklus render alami berikutnya). Sebelumnya
        // semua salinan (bisa 5-10+ blok) dibuat DULU baru di-forced-layout sekaligus,
        // padahal cuma butuh ukuran dari 1 blok saja.
        const firstBlock = createBlock(text)
        firstBlock.style.marginBottom = `${gap}px`
        track.appendChild(firstBlock)

        void track.offsetHeight

        const measuredHeight = Math.max(
          firstBlock.scrollHeight || 0,
          firstBlock.offsetHeight || 0,
          firstBlock.getBoundingClientRect().height || 0
        )
        const blockHeight = measuredHeight > 0 ? measuredHeight : (style.fontSize || 18) * 1.4
        const unit = blockHeight + gap
        const duration = unit / speed

        // Tentukan jumlah salinan yang cukup untuk memenuhi canvas & offset,
        // lalu tambahkan sisanya (tanpa perlu forced layout lagi).
        const copiesNeeded = Math.max(3, Math.ceil(el.height / unit) + 3)
        for (let i = 1; i < copiesNeeded; i++) {
          const span = createBlock(text)
          span.style.marginBottom = `${gap}px`
          span.setAttribute('aria-hidden', 'true')
          track.appendChild(span)
        }

        let tween
        if (direction === 'up') {
          gsap.set(track, { y: 0 })
          tween = gsap.fromTo(track, { y: 0 }, { y: -unit, duration, ease: 'none', repeat: -1 })
        } else {
          gsap.set(track, { y: -unit })
          tween = gsap.fromTo(track, { y: -unit }, { y: 0, duration, ease: 'none', repeat: -1 })
        }

        if (record) {
          if (record.scrollTween) record.scrollTween.kill()
          record.scrollTween = tween
          if (measuredHeight > 0) {
            record.scrollSig = sig
          } else {
            record.scrollSig = null
          }
        }
      }
    }

    function formatClockTime(timezone, formatStr, prefix = '', suffix = '') {
      const tz = timezone || 'Asia/Jakarta'
      const fmt = formatStr || 'HH:mm:ss'
      const now = new Date()

      try {
        const formatter = new Intl.DateTimeFormat('en-US', {
          timeZone: tz,
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          weekday: 'long',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        })
        const parts = formatter.formatToParts(now)
        const p = {}
        for (const part of parts) {
          p[part.type] = part.value
        }

        let hour24 = parseInt(p.hour || '0', 10)
        if (hour24 === 24) hour24 = 0
        const hour12 = hour24 % 12 || 12
        const ampm = hour24 >= 12 ? 'PM' : 'AM'

        const monthNameFormatter = new Intl.DateTimeFormat('en-US', { timeZone: tz, month: 'long' })
        const monthShortFormatter = new Intl.DateTimeFormat('en-US', { timeZone: tz, month: 'short' })
        const weekdayShortFormatter = new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short' })

        const monthName = monthNameFormatter.format(now)
        const monthShort = monthShortFormatter.format(now)
        const weekdayShort = weekdayShortFormatter.format(now)

        const strHH = String(hour24).padStart(2, '0')
        const strH = String(hour24)
        const strhh = String(hour12).padStart(2, '0')
        const strh = String(hour12)
        const strmm = String(p.minute || '00').padStart(2, '0')
        const strm = String(parseInt(p.minute || '0', 10))
        const strss = String(p.second || '00').padStart(2, '0')
        const strs = String(parseInt(p.second || '0', 10))
        const strYYYY = p.year || '2026'
        const strYY = strYYYY.slice(-2)
        const strMM = p.month || '01'
        const strM = String(parseInt(strMM, 10))
        const strDD = p.day || '01'
        const strD = String(parseInt(strDD, 10))
        const strdddd = p.weekday || ''
        const strddd = weekdayShort

        const replacements = {
          dddd: strdddd,
          ddd: strddd,
          YYYY: strYYYY,
          yyyy: strYYYY,
          YY: strYY,
          yy: strYY,
          MMMM: monthName,
          MMM: monthShort,
          MM: strMM,
          M: strM,
          DD: strDD,
          dd: strDD,
          D: strD,
          d: strD,
          HH: strHH,
          H: strH,
          hh: strhh,
          h: strh,
          mm: strmm,
          m: strm,
          ss: strss,
          s: strs,
          A: ampm,
          a: ampm.toLowerCase(),
        }

        const regex = /dddd|ddd|YYYY|yyyy|YY|yy|MMMM|MMM|MM|M|DD|dd|D|d|HH|H|hh|h|mm|m|ss|s|A|a/g
        const result = fmt.replace(regex, (match) => replacements[match] !== undefined ? replacements[match] : match)

        return `${prefix}${result}${suffix}`
      } catch (e) {
        return `${prefix}${now.toLocaleTimeString()}${suffix}`
      }
    }

    function resolveElementText(el) {
      const binding = el?.textBinding
      const fallback = binding?.fallback || el?.style?.text || ''
      if (!binding?.enabled) return el?.style?.text || fallback

      let rawValue
      if (binding.source === 'clock') {
        return formatClockTime(binding.timezone, binding.format, binding.prefix, binding.suffix)
      } else if (binding.source === 'f1data') {
        rawValue = getValueAtPath(f1Data, binding.fieldPath)
      } else if (binding.field === 'latestChatAuthor') {
        rawValue = displayedChat.author
      } else if (binding.field === 'latestChatMessage') {
        rawValue = displayedChat.message
      } else {
        rawValue = liveStats?.[binding.field]
      }

      const formatted = formatBoundValue(rawValue, binding.format || 'raw')
      const value = formatted || fallback
      return `${binding.prefix || ''}${value}${binding.suffix || ''}`
    }

    // Fase 9 — Element Binding/Grouping (Parent-Child Transform), lihat Vision.md §3.3.2.
    // Scope sengaja 1 level: kalau `parent` itu sendiri sudah jadi child elemen lain,
    // referensi diabaikan (elemen diperlakukan top-level) supaya tidak ada nested group
    // berlapis yang belum didukung. Self-reference & parent yang tidak ditemukan juga
    // diabaikan secara graceful (fallback ke top-level, tidak pernah crash).
    function getEffectiveParentId(el, byId) {
      if (!el || !el.parentId) return null
      const parent = byId.get(el.parentId)
      if (!parent || parent.id === el.id) return null
      if (parent.parentId && byId.has(parent.parentId)) return null
      return parent.id
    }

    function applyElementBox(node, el, hasChildren) {
      node.style.left = `${el.x}px`
      node.style.top = `${el.y}px`
      node.style.width = `${el.width}px`
      node.style.height = `${el.height}px`
      node.style.zIndex = el.zIndex || 1
      node.style.opacity = el.opacity !== undefined ? el.opacity : 1
      // Elemen yang jadi parent (punya child) tidak di-clip supaya child yang posisinya
      // melebihi bounding box parent tetap terlihat penuh (container murni pembungkus
      // transform, bukan viewport visual yang membatasi konten anaknya).
      node.style.overflow = hasChildren ? 'visible' : 'hidden'
      node.style.transformStyle = hasChildren ? 'preserve-3d' : 'flat'
      node.style.borderRadius = `${el.style?.borderRadius || 0}px`
      node.style.borderWidth = `${el.style?.borderWidth || 0}px`
      node.style.borderStyle = el.style?.borderStyle || (el.style?.borderWidth ? 'solid' : 'none')
      node.style.borderColor = el.style?.borderColor || 'transparent'

      if (el.style?.gradient?.enabled) {
        const from = el.style.gradient.from || '#0f172a'
        const to = el.style.gradient.to || '#020617'
        node.style.background = `linear-gradient(${el.style.gradient.angle || 90}deg, ${from}, ${to})`
      } else {
        node.style.background = 'none'
        node.style.backgroundColor = el.style?.backgroundColor || 'transparent'
      }

      if (el.style?.shadowColor) {
        node.style.boxShadow = `${el.style.shadowOffsetX || 0}px ${el.style.shadowOffsetY || 4}px ${el.style.shadowBlur || 16}px ${el.style.shadowColor}`
      } else {
        node.style.boxShadow = 'none'
      }
    }

    // PERF: signature ringan pengganti JSON.stringify(). JSON.stringify generik
    // (harus traverse semua key, urutan, quoting, dst) padahal kita cuma butuh
    // bandingkan beberapa field yang benar-benar dibaca oleh applyElementBox/
    // setBaselineState/buildTimelineFromSequence. String concat manual jauh lebih
    // murah dan hasilnya tetap unik untuk kombinasi nilai yang berbeda.
    function computeBoxSignature(el, hasChildren) {
      const s = el.style || {}
      const g = s.gradient || {}
      return [
        el.x, el.y, el.width, el.height, el.zIndex, el.opacity, el.scale, el.rotation, el.rotationX, el.rotationY, el.perspective, hasChildren ? 1 : 0,
        s.borderRadius, s.borderWidth, s.borderStyle, s.borderColor,
        g.enabled ? 1 : 0, g.from, g.to, g.angle,
        s.backgroundColor,
        s.shadowColor, s.shadowOffsetX, s.shadowOffsetY, s.shadowBlur,
        s.textShadowColor, s.textShadowOffsetX, s.textShadowOffsetY, s.textShadowBlur,
      ].join('|')
    }

    function computeAnimationSignature(config) {
      if (!config || !Array.isArray(config.sequence)) return 'loop:0|seq:'
      let out = `loop:${config.loop ? 1 : 0}|seq:`
      for (const step of config.sequence) {
        if (step.type === 'delay') {
          out += `[delay,${step.duration}]`
          continue
        }
        const p = step.properties || {}
        out += `[${step.type},${step.duration},${step.ease},${step.repeat},${step.yoyo ? 1 : 0},x:${p.x},y:${p.y},op:${p.opacity},sc:${p.scale},rot:${p.rotation},rx:${p.rotationX},ry:${p.rotationY},pers:${p.perspective}]`
      }
      return out
    }

    function applyElementContent(node, el) {
      if (el.type === 'image' && el.src) {
        let image = node.querySelector('img[data-asset-image]')
        if (!image) {
          node.replaceChildren()
          image = document.createElement('img')
          image.dataset.assetImage = 'true'
          image.draggable = false
          node.appendChild(image)
        }
        image.src = el.src
        image.alt = el.name || 'Image asset'
        image.style.width = '100%'
        image.style.height = '100%'
        image.style.display = 'block'
        image.style.objectFit = el.objectFit || 'contain'
      } else if (el.type === 'text' || el.style?.text !== undefined) {
        const text = resolveElementText(el)
        const record = renderedElements.get(el.id)
        if (el.scroll?.enabled) {
          if (record?.marqueeTween) { record.marqueeTween.kill(); record.marqueeTween = null; record.marqueeSig = null; }
          applyScrollText(node, el, text)
        } else if (el.marquee?.enabled) {
          if (record?.scrollTween) { record.scrollTween.kill(); record.scrollTween = null; record.scrollSig = null; }
          applyMarqueeText(node, el, text)
        } else {
          if (record?.marqueeTween) { record.marqueeTween.kill(); record.marqueeTween = null; record.marqueeSig = null; }
          if (record?.scrollTween) { record.scrollTween.kill(); record.scrollTween = null; record.scrollSig = null; }
          let textEl = node.querySelector('.marquee-track, .scroll-track') ? null : node.firstElementChild
          if (!textEl) {
            node.replaceChildren()
            textEl = document.createElement('div')
            node.appendChild(textEl)
          }
          styleStaticText(textEl, el, text)
        }
      } else {
        node.replaceChildren()
      }
    }

    /** Kompatibilitas: apply box + content sekaligus (dipakai saat mount elemen baru). */
    function applyElement(node, el) {
      applyElementBox(node, el)
      applyElementContent(node, el)
    }

    function renderScene(scene) {
      if (!scene || !scene.elements) return
      scaleViewport()
      const visibleElements = scene.elements.filter(el => !el.hidden)
      const visibleIds = new Set(visibleElements.map(el => el.id))
      const byId = new Map(scene.elements.map(el => [el.id, el]))

      renderedElements.forEach(({ node, marqueeTween, scrollTween }, id) => {
        if (visibleIds.has(id)) return
        if (marqueeTween) marqueeTween.kill()
        if (scrollTween) scrollTween.kill()
        AnimationEngine.killTimeline(id)
        renderedElements.delete(id)
        node.remove()
      })

      // Pisahkan elemen top-level vs child (Fase 9 — Parent-Child Transform) supaya
      // child bisa dipasang sebagai DOM descendant dari node parent-nya: transform
      // (posisi/animasi) parent otomatis "membawa" child tanpa sinkronisasi manual.
      const topLevel = []
      const childrenByParent = new Map()
      const parentIdsInUse = new Set()
      visibleElements.forEach(el => {
        const parentId = getEffectiveParentId(el, byId)
        if (parentId) {
          parentIdsInUse.add(parentId)
          if (!childrenByParent.has(parentId)) childrenByParent.set(parentId, [])
          childrenByParent.get(parentId).push(el)
        } else {
          topLevel.push(el)
        }
      })

      function mountOrUpdate(el, container) {
        const existing = renderedElements.get(el.id)
        const nextAnimConfig = AnimationEngine.normalizeAnimationConfig(el.animation)
        const nextAnimSignature = computeAnimationSignature(nextAnimConfig)
        const hasActiveSequence = nextAnimConfig.sequence.length > 0
        const hasChildren = parentIdsInUse.has(el.id)
        // PERF: signature box/posisi elemen -> guard supaya applyElementBox/setBaselineState
        // (yang menulis banyak inline style sekaligus) tidak dipanggil ulang tiap poll 2 detik
        // kalau datanya persis sama dengan render sebelumnya (mencegah reflow sia-sia).
        const nextBoxSignature = computeBoxSignature(el, hasChildren)

        if (existing) {
          // Pastikan node berada di container yang benar (mis. parentId baru diubah,
          // atau parent sebelumnya sempat dihapus lalu node ter-detach dari dokumen).
          if (existing.node.parentElement !== container) container.appendChild(existing.node)

          // Data binding/teks harus tetap live-update meski elemen sedang dianimasikan.
          applyElementContent(existing.node, el)

          if (existing.animationSignature !== nextAnimSignature) {
            // Definisi animasi berubah (mis. disunting ulang) -> reset ke baseline kanonis dulu,
            // baru bangun ulang timeline dari awal.
            applyElementBox(existing.node, el, hasChildren)
            AnimationEngine.setBaselineState(existing.node, el)
            AnimationEngine.buildTimelineFromSequence(el.id, existing.node, nextAnimConfig)
            existing.animationSignature = nextAnimSignature
            existing.boxSignature = nextBoxSignature
          } else if (!hasActiveSequence) {
            // Tidak ada animasi sama sekali -> tetap sinkronkan posisi/opacity/style, TAPI
            // cuma kalau datanya benar-benar berubah dari render sebelumnya.
            if (existing.boxSignature !== nextBoxSignature) {
              applyElementBox(existing.node, el, hasChildren)
              AnimationEngine.setBaselineState(existing.node, el)
              existing.boxSignature = nextBoxSignature
            }
          } else {
            // Signature sama & sequence aktif: sengaja tidak menyentuh posisi/opacity/box-style
            // (supaya timeline yang berjalan, termasuk loop infinite, tidak "distop" tiap poll),
            // tapi overflow tetap perlu disinkronkan kalau status "punya child" berubah.
            existing.node.style.overflow = hasChildren ? 'visible' : 'hidden'
          }
          return
        }

        const div = document.createElement('div')
        div.className = 'overlay-element'
        div.id = `render-el-${el.id}`
        div.dataset.elementId = el.id
        applyElementBox(div, el, hasChildren)
        container.appendChild(div)
        renderedElements.set(el.id, { node: div, animationSignature: nextAnimSignature, boxSignature: nextBoxSignature })
        applyElementContent(div, el)
        AnimationEngine.setBaselineState(div, el)
        AnimationEngine.buildTimelineFromSequence(el.id, div, nextAnimConfig)
      }

      topLevel.sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0)).forEach(el => mountOrUpdate(el, viewport))

      childrenByParent.forEach((kids, parentId) => {
        const parentNode = renderedElements.get(parentId)?.node
        if (!parentNode) return // parent belum ter-mount (mis. hidden) -> child ikut tidak dirender
        kids.sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0)).forEach(el => mountOrUpdate(el, parentNode))
      })
    }

    function processChatQueue(newLiveStats) {
      const incoming = Array.isArray(newLiveStats.chatMessages) ? newLiveStats.chatMessages : []

      if (isFirstStatsSync) {
        incoming.forEach(msg => displayedChatIds.add(msg.id))
        if (incoming.length > 0) {
          const last = incoming[incoming.length - 1]
          displayedChat = { author: last.author, message: last.message }
        }
        isFirstStatsSync = false
        return
      }

      const queuedIds = new Set(chatDisplayQueue.map(msg => msg.id))
      incoming.forEach(msg => {
        if (!displayedChatIds.has(msg.id) && !queuedIds.has(msg.id)) {
          chatDisplayQueue.push(msg)
        }
      })

      const MAX_QUEUE = 15
      while (chatDisplayQueue.length > MAX_QUEUE) {
        chatDisplayQueue.shift()
      }
    }

    function tickChatDisplay() {
      if (chatDisplayQueue.length === 0) return
      const next = chatDisplayQueue.shift()
      displayedChatIds.add(next.id)
      displayedChat = { author: next.author, message: next.message }

      if (currentScene) {
        currentScene.elements.forEach(el => {
          const field = el.textBinding?.field
          if (el.textBinding?.enabled && (field === 'latestChatAuthor' || field === 'latestChatMessage')) {
            const rendered = renderedElements.get(el.id)
            const textEl = rendered?.node?.firstElementChild
            if (textEl) {
              gsap.fromTo(textEl, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' })
            }
          }
        })
        requestAnimationFrame(() => renderScene(currentScene))
      }
    }

    function restartChatDisplayTimer() {
      if (chatDisplayTimer) clearInterval(chatDisplayTimer)
      chatDisplayTimer = setInterval(tickChatDisplay, chatDisplayDurationMs)
    }

    async function syncPlatformConnectorConfig() {
      try {
        const res = await fetch('/api/platform-connector')
        if (!res.ok) return
        const data = await res.json()
        const nextDuration = Math.max(1500, Math.min(15000, Number(data?.config?.chatDisplayDurationMs) || 4000))
        if (nextDuration !== chatDisplayDurationMs) {
          chatDisplayDurationMs = nextDuration
          restartChatDisplayTimer()
        }
      } catch (err) {
        console.error('Failed to sync platform connector config:', err)
      }
    }

    async function syncScene(isInitial = false) {
      try {
        const res = await fetch(`/api/scenes/${encodeURIComponent(overlaySceneId)}`)
        if (res.ok) {
          const text = await res.text()
          if (text !== lastSceneHash || isInitial) {
            lastSceneHash = text
            currentScene = JSON.parse(text)
            // PERF: tunda DOM write ke awal frame render berikutnya, supaya browser
            // bisa gabungkan dengan siklus render alami (bukan menyisip di tengah
            // microtask fetch, yang berisiko memicu layout di waktu kurang optimal).
            requestAnimationFrame(() => renderScene(currentScene))
          }
        }
      } catch (err) {
        console.error('Failed to sync scene:', err)
      }
    }

    async function syncLiveStats(isInitial = false) {
      try {
        const res = await fetch('/api/live-stats')
        if (!res.ok) return
        const text = await res.text()
        if (text !== lastLiveStatsHash || isInitial) {
          lastLiveStatsHash = text
          liveStats = JSON.parse(text)
          processChatQueue(liveStats)
          if (currentScene) requestAnimationFrame(() => renderScene(currentScene))
        }
      } catch (err) {
        console.error('Failed to sync live stats:', err)
      }
    }

    async function syncF1Data(isInitial = false) {
      try {
        const res = await fetch('/api/f1-data')
        if (!res.ok) return
        const text = await res.text()
        if (text !== lastF1DataHash || isInitial) {
          lastF1DataHash = text
          f1Data = JSON.parse(text)
          if (currentScene) renderScene(currentScene)
        }
      } catch (err) {
        console.error('Failed to sync F1 data:', err)
      }
    }

    window.addEventListener('resize', scaleViewport)

    document.addEventListener('DOMContentLoaded', () => {
      scaleViewport()
      syncLiveStats(true)
      syncF1Data(true)
      syncScene(true)
      syncPlatformConnectorConfig()
      restartChatDisplayTimer()

      // PERF: offset waktu MULAI tiap interval polling (bukan mengubah frekuensinya),
      // supaya syncScene & syncLiveStats (sama-sama tiap 2 detik) tidak selalu
      // menumpuk trigger renderScene() di momen yang persis sama. Ini menyebar
      // beban kerja main thread lebih rata sepanjang waktu.
      setTimeout(() => setInterval(() => syncScene(false), 2000), 0)
      setTimeout(() => setInterval(() => syncLiveStats(false), 2000), 300)
      setTimeout(() => setInterval(() => syncF1Data(false), 30000), 600)
      setTimeout(() => setInterval(syncPlatformConnectorConfig, 5000), 900)

      // Tick per 1 detik khusus elemen jam (clock) tanpa re-render scene penuh
      setInterval(() => {
        if (!currentScene || !currentScene.elements) return
        currentScene.elements.forEach(el => {
          if (!el.hidden && el.textBinding?.enabled && el.textBinding?.source === 'clock') {
            const record = renderedElements.get(el.id)
            if (record && record.node) {
              applyElementContent(record.node, el)
            }
          }
        })
      }, 1000)
    })
  </script>
</body>

</html>
