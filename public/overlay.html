<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveOverlay - Stream Overlay Renderer</title>
  <!-- GSAP Animation Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/animation-engine.js?v=2"></script>
  <!-- Google Fonts for Stream Overlays -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&family=Limelight&family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@400;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800;900&family=Quicksand:wght@400;500;600;700&family=Roboto:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      color: #ffffff;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #overlay-viewport {
      position: relative;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      overflow: hidden;
    }

    .overlay-element {
      position: absolute;
      box-sizing: border-box;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="overlay-viewport">
    <!-- Dynamic Animated Scene Elements Injected Here -->
  </div>

  <script>
    const viewport = document.getElementById('overlay-viewport')
    const overlayParams = new URLSearchParams(window.location.search)
    const overlaySceneId = overlayParams.get('scene') || overlayParams.get('id') || 'default'
    let lastSceneHash = ''
    let lastLiveStatsHash = ''
    let currentScene = null
    let liveStats = {
      platform: 'TikTok Live',
      username: '@creator',
      displayName: 'Creator Stream',
      viewerCount: 0,
      followerCount: 0,
      likeCount: 0,
      latestChatAuthor: '',
      latestChatMessage: '',
      isLive: false,
      lastUpdatedAt: '',
      chatMessages: []
    }
    let f1Data = { sessions: [], driverStandings: [], constructorStandings: [] }
    let lastF1DataHash = ''
    let displayedChat = { author: '', message: '' }
    let chatDisplayQueue = []
    let displayedChatIds = new Set()
    let chatDisplayDurationMs = 4000
    let chatDisplayTimer = null
    let isFirstStatsSync = true
    const renderedElements = new Map()

    function getSceneCanvasSize(scene) {
      return {
        width: Number(scene?.canvas?.width) || 1920,
        height: Number(scene?.canvas?.height) || 1080,
      }
    }

    function getValueAtPath(data, path) {
      if (!path) return data
      return path.split(/[.[\]]+/).filter(Boolean).reduce((curr, key) => (curr && typeof curr === 'object' ? curr[key] : undefined), data)
    }

    function scaleViewport() {
      const { width, height } = getSceneCanvasSize(currentScene)
      viewport.style.width = `${width}px`
      viewport.style.height = `${height}px`
      viewport.style.backgroundColor = currentScene?.canvas?.backgroundColor || 'transparent'

      const windowW = window.innerWidth
      const windowH = window.innerHeight
      if (windowW !== width || windowH !== height) {
        const scaleX = windowW / width
        const scaleY = windowH / height
        const scale = Math.min(scaleX, scaleY)
        viewport.style.transform = `scale(${scale})`
      } else {
        viewport.style.transform = 'none'
      }
    }

    // Animasi elemen (entrance/loop/exit lama) sekarang ditangani oleh
    // AnimationEngine (public/animation-engine.js) via animation.sequence.
    // Lihat renderScene() di bawah untuk titik integrasinya.

    function formatBoundValue(value, format) {
      if (value === undefined || value === null || value === '') return ''
      if (format === 'number') {
        const numeric = Number(value)
        return Number.isFinite(numeric) ? new Intl.NumberFormat().format(numeric) : String(value)
      }
      if (format === 'uppercase') return String(value).toUpperCase()
      if (format === 'lowercase') return String(value).toLowerCase()
      return String(value)
    }

    const measureCtx = document.createElement('canvas').getContext('2d')

    function measureTextWidth(text, style = {}) {
      const fontSize = style.fontSize || 18
      const fontFamily = style.fontFamily || 'Inter, sans-serif'
      const fontWeight = style.fontWeight || 'normal'
      const letterSpacing = style.letterSpacing || 0
      measureCtx.font = `${fontWeight} ${fontSize}px ${fontFamily}`
      const base = measureCtx.measureText(text).width
      const extra = letterSpacing * Math.max(0, text.length - 1)
      return base + extra
    }

    function ensureMarqueeTrack(node) {
      let track = node.querySelector('.marquee-track')
      if (!track) {
        node.replaceChildren()
        track = document.createElement('div')
        track.className = 'marquee-track'
        track.style.position = 'absolute'
        track.style.top = '50%'
        track.style.transform = 'translateY(-50%)'
        track.style.display = 'flex'
        track.style.whiteSpace = 'nowrap'
        track.style.willChange = 'transform'
        node.appendChild(track)
      }
      return track
    }

    function styleStaticText(textEl, el, text) {
      textEl.style.width = '100%'
      textEl.style.height = '100%'
      textEl.style.display = 'flex'
      textEl.style.alignItems = 'center'
      textEl.style.fontFamily = el.style?.fontFamily || 'Inter, sans-serif'
      textEl.style.fontSize = `${el.style?.fontSize || 18}px`
      textEl.style.fontWeight = el.style?.fontWeight || 'normal'
      textEl.style.color = el.style?.color || '#ffffff'
      textEl.style.padding = `${el.style?.padding || 0}px`
      textEl.style.textAlign = el.style?.textAlign || 'left'
      textEl.style.textTransform = el.style?.textTransform || 'none'
      textEl.style.letterSpacing = `${el.style?.letterSpacing || 0}px`
      textEl.style.justifyContent = el.style?.textAlign === 'center' ? 'center' : (el.style?.textAlign === 'right' ? 'flex-end' : 'flex-start')
      textEl.textContent = text
    }

    function applyMarqueeText(node, el, text) {
      const cfg = el.marquee || {}
      const speed = cfg.speed || 80
      const gap = cfg.gap ?? 60
      const style = el.style || {}
      const textWidth = measureTextWidth(text, style)

      const record = renderedElements.get(el.id)
      const sig = [text, el.width, speed, gap, style.fontSize, style.fontFamily, style.fontWeight, style.letterSpacing].join('|')

      if (record && record.marqueeSig === sig) return

      const track = ensureMarqueeTrack(node)
      track.replaceChildren()

      const unit = textWidth + gap
      // Buat salinan sebanyak yang dibutuhkan supaya container selalu penuh
      // sepanjang animasi, apapun rasio panjang teks vs lebar container.
      const copiesNeeded = Math.max(2, Math.ceil(el.width / unit) + 2)

      for (let i = 0; i < copiesNeeded; i++) {
        const span = document.createElement('span')
        span.textContent = text
        span.style.marginRight = `${gap}px`
        span.style.flexShrink = '0'
        span.style.fontFamily = style.fontFamily || 'Inter, sans-serif'
        span.style.fontSize = `${style.fontSize || 18}px`
        span.style.fontWeight = style.fontWeight || 'normal'
        span.style.color = style.color || '#ffffff'
        span.style.letterSpacing = `${style.letterSpacing || 0}px`
        span.style.textTransform = style.textTransform || 'none'
        if (i > 0) span.setAttribute('aria-hidden', 'true')
        track.appendChild(span)
      }

      gsap.killTweensOf(track)
      const duration = unit / speed
      const direction = (cfg.direction || 'rtl') === 'ltr' ? 1 : -1
      gsap.set(track, { x: 0 })
      const tween = gsap.fromTo(track, { x: 0 }, { x: direction * unit, duration, ease: 'none', repeat: -1 })

      if (record) {
        record.marqueeTween = tween; record.marqueeSig = sig
      }
    }

    function resolveElementText(el) {
      const binding = el?.textBinding
      const fallback = binding?.fallback || el?.style?.text || ''
      if (!binding?.enabled) return el?.style?.text || fallback

      let rawValue
      if (binding.source === 'f1data') {
        rawValue = getValueAtPath(f1Data, binding.fieldPath)
      } else if (binding.field === 'latestChatAuthor') {
        rawValue = displayedChat.author
      } else if (binding.field === 'latestChatMessage') {
        rawValue = displayedChat.message
      } else {
        rawValue = liveStats?.[binding.field]
      }

      const formatted = formatBoundValue(rawValue, binding.format || 'raw')
      const value = formatted || fallback
      return `${binding.prefix || ''}${value}${binding.suffix || ''}`
    }

    function applyElementBox(node, el) {
      node.style.left = `${el.x}px`
      node.style.top = `${el.y}px`
      node.style.width = `${el.width}px`
      node.style.height = `${el.height}px`
      node.style.zIndex = el.zIndex || 1
      node.style.opacity = el.opacity !== undefined ? el.opacity : 1
      node.style.borderRadius = `${el.style?.borderRadius || 0}px`
      node.style.borderWidth = `${el.style?.borderWidth || 0}px`
      node.style.borderStyle = el.style?.borderStyle || (el.style?.borderWidth ? 'solid' : 'none')
      node.style.borderColor = el.style?.borderColor || 'transparent'

      if (el.style?.gradient?.enabled) {
        const from = el.style.gradient.from || '#0f172a'
        const to = el.style.gradient.to || '#020617'
        node.style.background = `linear-gradient(${el.style.gradient.angle || 90}deg, ${from}, ${to})`
      } else {
        node.style.background = 'none'
        node.style.backgroundColor = el.style?.backgroundColor || 'transparent'
      }

      if (el.style?.shadowColor) {
        node.style.boxShadow = `${el.style.shadowOffsetX || 0}px ${el.style.shadowOffsetY || 4}px ${el.style.shadowBlur || 16}px ${el.style.shadowColor}`
      } else {
        node.style.boxShadow = 'none'
      }
    }

    function applyElementContent(node, el) {
      if (el.type === 'image' && el.src) {
        let image = node.querySelector('img[data-asset-image]')
        if (!image) {
          node.replaceChildren()
          image = document.createElement('img')
          image.dataset.assetImage = 'true'
          image.draggable = false
          node.appendChild(image)
        }
        image.src = el.src
        image.alt = el.name || 'Image asset'
        image.style.width = '100%'
        image.style.height = '100%'
        image.style.display = 'block'
        image.style.objectFit = el.objectFit || 'contain'
      } else if (el.type === 'text' || el.style?.text !== undefined) {
        const text = resolveElementText(el)
        if (el.marquee?.enabled) {
          applyMarqueeText(node, el, text)
        } else {
          let textEl = node.querySelector('.marquee-track') ? null : node.firstElementChild
          if (!textEl) {
            node.replaceChildren()
            textEl = document.createElement('div')
            node.appendChild(textEl)
          }
          textEl.style.width = '100%'
          textEl.style.height = '100%'
          textEl.style.display = 'flex'
          textEl.style.alignItems = 'center'
          textEl.style.fontFamily = el.style?.fontFamily || 'Inter, sans-serif'
          textEl.style.fontSize = `${el.style?.fontSize || 18}px`
          textEl.style.fontWeight = el.style?.fontWeight || 'normal'
          textEl.style.color = el.style?.color || '#ffffff'
          textEl.style.padding = `${el.style?.padding || 0}px`
          textEl.style.textAlign = el.style?.textAlign || 'left'
          textEl.style.textTransform = el.style?.textTransform || 'none'
          textEl.style.letterSpacing = `${el.style?.letterSpacing || 0}px`
          textEl.style.justifyContent = el.style?.textAlign === 'center' ? 'center' : (el.style?.textAlign === 'right' ? 'flex-end' : 'flex-start')
          textEl.textContent = text
        }
      } else {
        node.replaceChildren()
      }
    }

    /** Kompatibilitas: apply box + content sekaligus (dipakai saat mount elemen baru). */
    function applyElement(node, el) {
      applyElementBox(node, el)
      applyElementContent(node, el)
    }

    function renderScene(scene) {
      if (!scene || !scene.elements) return
      scaleViewport()
      const visibleElements = scene.elements.filter(el => !el.hidden)
      const visibleIds = new Set(visibleElements.map(el => el.id))

      renderedElements.forEach(({ node, marqueeTween }, id) => {
        if (visibleIds.has(id)) return
        if (marqueeTween) marqueeTween.kill()
        AnimationEngine.killTimeline(id)
        renderedElements.delete(id)
        node.remove()
      })

      visibleElements.sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0)).forEach(el => {
        const existing = renderedElements.get(el.id)
        const nextAnimConfig = AnimationEngine.normalizeAnimationConfig(el.animation)
        const nextAnimSignature = JSON.stringify(nextAnimConfig)
        const hasActiveSequence = nextAnimConfig.sequence.length > 0

        if (existing) {
          // Data binding/teks harus tetap live-update meski elemen sedang dianimasikan.
          applyElementContent(existing.node, el)

          if (existing.animationSignature !== nextAnimSignature) {
            // Definisi animasi berubah (mis. disunting ulang) -> reset ke baseline kanonis dulu,
            // baru bangun ulang timeline dari awal.
            applyElementBox(existing.node, el)
            AnimationEngine.setBaselineState(existing.node, el)
            AnimationEngine.buildTimelineFromSequence(el.id, existing.node, nextAnimConfig)
            existing.animationSignature = nextAnimSignature
          } else if (!hasActiveSequence) {
            // Tidak ada animasi sama sekali -> tetap sinkronkan posisi/opacity/style setiap poll
            // (supaya perubahan dari editor, drag, dll tetap tercermin).
            applyElementBox(existing.node, el)
            AnimationEngine.setBaselineState(existing.node, el)
          }
          // Kalau signature sama & sequence aktif: sengaja TIDAK menyentuh posisi/opacity/box-style,
          // supaya timeline yang sedang berjalan (termasuk loop infinite) tidak "distop" tiap poll.
          return
        }

        const div = document.createElement('div')
        div.className = 'overlay-element'
        div.id = `render-el-${el.id}`
        div.dataset.elementId = el.id
        applyElementBox(div, el)
        applyElementContent(div, el)
        AnimationEngine.setBaselineState(div, el)
        viewport.appendChild(div)
        renderedElements.set(el.id, { node: div, animationSignature: nextAnimSignature })
        AnimationEngine.buildTimelineFromSequence(el.id, div, nextAnimConfig)
      })
    }

    function processChatQueue(newLiveStats) {
      const incoming = Array.isArray(newLiveStats.chatMessages) ? newLiveStats.chatMessages : []

      if (isFirstStatsSync) {
        incoming.forEach(msg => displayedChatIds.add(msg.id))
        if (incoming.length > 0) {
          const last = incoming[incoming.length - 1]
          displayedChat = { author: last.author, message: last.message }
        }
        isFirstStatsSync = false
        return
      }

      const queuedIds = new Set(chatDisplayQueue.map(msg => msg.id))
      incoming.forEach(msg => {
        if (!displayedChatIds.has(msg.id) && !queuedIds.has(msg.id)) {
          chatDisplayQueue.push(msg)
        }
      })

      const MAX_QUEUE = 15
      while (chatDisplayQueue.length > MAX_QUEUE) {
        chatDisplayQueue.shift()
      }
    }

    function tickChatDisplay() {
      if (chatDisplayQueue.length === 0) return
      const next = chatDisplayQueue.shift()
      displayedChatIds.add(next.id)
      displayedChat = { author: next.author, message: next.message }

      if (currentScene) {
        currentScene.elements.forEach(el => {
          const field = el.textBinding?.field
          if (el.textBinding?.enabled && (field === 'latestChatAuthor' || field === 'latestChatMessage')) {
            const rendered = renderedElements.get(el.id)
            const textEl = rendered?.node?.firstElementChild
            if (textEl) {
              gsap.fromTo(textEl, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' })
            }
          }
        })
        renderScene(currentScene)
      }
    }

    function restartChatDisplayTimer() {
      if (chatDisplayTimer) clearInterval(chatDisplayTimer)
      chatDisplayTimer = setInterval(tickChatDisplay, chatDisplayDurationMs)
    }

    async function syncPlatformConnectorConfig() {
      try {
        const res = await fetch('/api/platform-connector')
        if (!res.ok) return
        const data = await res.json()
        const nextDuration = Math.max(1500, Math.min(15000, Number(data?.config?.chatDisplayDurationMs) || 4000))
        if (nextDuration !== chatDisplayDurationMs) {
          chatDisplayDurationMs = nextDuration
          restartChatDisplayTimer()
        }
      } catch (err) {
        console.error('Failed to sync platform connector config:', err)
      }
    }

    async function syncScene(isInitial = false) {
      try {
        const res = await fetch(`/api/scenes/${encodeURIComponent(overlaySceneId)}`)
        if (res.ok) {
          const text = await res.text()
          if (text !== lastSceneHash || isInitial) {
            lastSceneHash = text
            currentScene = JSON.parse(text)
            renderScene(currentScene)
          }
        }
      } catch (err) {
        console.error('Failed to sync scene:', err)
      }
    }

    async function syncLiveStats(isInitial = false) {
      try {
        const res = await fetch('/api/live-stats')
        if (!res.ok) return
        const text = await res.text()
        if (text !== lastLiveStatsHash || isInitial) {
          lastLiveStatsHash = text
          liveStats = JSON.parse(text)
          processChatQueue(liveStats)
          if (currentScene) renderScene(currentScene)
        }
      } catch (err) {
        console.error('Failed to sync live stats:', err)
      }
    }

    async function syncF1Data(isInitial = false) {
      try {
        const res = await fetch('/api/f1-data')
        if (!res.ok) return
        const text = await res.text()
        if (text !== lastF1DataHash || isInitial) {
          lastF1DataHash = text
          f1Data = JSON.parse(text)
          if (currentScene) renderScene(currentScene)
        }
      } catch (err) {
        console.error('Failed to sync F1 data:', err)
      }
    }

    window.addEventListener('resize', scaleViewport)

    document.addEventListener('DOMContentLoaded', () => {
      scaleViewport()
      syncLiveStats(true)
      syncF1Data(true)
      syncScene(true)
      syncPlatformConnectorConfig()
      restartChatDisplayTimer()
      setInterval(() => syncScene(false), 2000)
      setInterval(() => syncLiveStats(false), 2000)
      setInterval(() => syncF1Data(false), 30000)
      setInterval(syncPlatformConnectorConfig, 5000)
    })
  </script>
</body>

</html>
