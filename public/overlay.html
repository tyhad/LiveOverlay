<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveOverlay - Stream Overlay Renderer</title>
  <!-- GSAP Animation Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Google Fonts for Stream Overlays -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      color: #ffffff;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #overlay-viewport {
      position: relative;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      overflow: hidden;
    }
    .overlay-element {
      position: absolute;
      box-sizing: border-box;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="overlay-viewport">
    <!-- Dynamic Animated Scene Elements Injected Here -->
  </div>

  <script>
    const viewport = document.getElementById('overlay-viewport')
    const overlayParams = new URLSearchParams(window.location.search)
    const overlaySceneId = overlayParams.get('scene') || overlayParams.get('id') || 'default'
    let lastSceneHash = ''
    let lastLiveStatsHash = ''
    let currentScene = null
    let liveStats = {
      platform: 'TikTok Live',
      username: '@creator',
      displayName: 'Creator Stream',
      viewerCount: 0,
      followerCount: 0,
      likeCount: 0,
      latestChatAuthor: '',
      latestChatMessage: '',
      isLive: false,
      lastUpdatedAt: '',
      chatMessages: []
    }
    let externalData = { sources: [] }
    let lastExternalDataHash = ''
    const renderedElements = new Map()
    const loopAnimations = new Map()

    function getSceneCanvasSize(scene) {
      return {
        width: Number(scene?.canvas?.width) || 1920,
        height: Number(scene?.canvas?.height) || 1080,
      }
    }

    function getPathSegments(path) {
      return String(path || '').match(/[^.[\]]+/g) || []
    }

    function getValueAtPath(data, path) {
      if (!path) return data
      return getPathSegments(path).reduce((current, segment) => {
        if (current === null || current === undefined) return undefined
        if (Array.isArray(current)) return current[Number(segment)]
        if (typeof current === 'object') return current[segment]
        return undefined
      }, data)
    }

    function getExternalSourceSnapshot(sourceId) {
      return externalData.sources.find(source => source.id === sourceId)
    }

    function scaleViewport() {
      const { width, height } = getSceneCanvasSize(currentScene)
      viewport.style.width = `${width}px`
      viewport.style.height = `${height}px`
      viewport.style.backgroundColor = currentScene?.canvas?.backgroundColor || 'transparent'

      const windowW = window.innerWidth
      const windowH = window.innerHeight
      if (windowW !== width || windowH !== height) {
        const scaleX = windowW / width
        const scaleY = windowH / height
        const scale = Math.min(scaleX, scaleY)
        viewport.style.transform = `scale(${scale})`
      } else {
        viewport.style.transform = 'none'
      }
    }

    function stopLoopAnimation(node) {
      const animation = loopAnimations.get(node)
      if (animation) animation.kill()
      loopAnimations.delete(node)
    }

    function playLoopAnimation(node, loop) {
      stopLoopAnimation(node)
      if (!node || !loop || loop.type === 'none') return
      const dur = loop.duration || 2.5
      let animation

      switch (loop.type) {
        case 'pulse':
          animation = gsap.to(node, { scale: 1.04, duration: dur / 2, repeat: -1, yoyo: true, ease: 'power1.inOut' })
          break
        case 'float':
          animation = gsap.to(node, { y: '-=10', duration: dur / 2, repeat: -1, yoyo: true, ease: 'sine.inOut' })
          break
        case 'glow':
          animation = gsap.to(node, { filter: 'drop-shadow(0 0 16px rgba(99,102,241,0.8))', duration: dur / 2, repeat: -1, yoyo: true, ease: 'sine.inOut' })
          break
        case 'swing':
          animation = gsap.to(node, { rotation: '+=4', duration: dur / 2, repeat: -1, yoyo: true, ease: 'sine.inOut' })
          break
        case 'heartbeat':
          animation = gsap.timeline({ repeat: -1, repeatDelay: Math.max(0, dur - 0.6) })
          animation.to(node, { scale: 1.08, duration: 0.15, ease: 'power1.out' })
             .to(node, { scale: 1.0, duration: 0.15, ease: 'power1.in' })
             .to(node, { scale: 1.05, duration: 0.15, ease: 'power1.out' })
             .to(node, { scale: 1.0, duration: 0.15, ease: 'power1.in' })
          break
        case 'bounce':
          animation = gsap.to(node, { y: '-=14', duration: dur / 2, repeat: -1, yoyo: true, ease: 'power2.out' })
          break
        case 'shake':
          animation = gsap.timeline({ repeat: -1, repeatDelay: dur })
          animation.to(node, { x: '+=5', duration: 0.08 })
             .to(node, { x: '-=10', duration: 0.08 })
             .to(node, { x: '+=8', duration: 0.08 })
             .to(node, { x: '-=6', duration: 0.08 })
             .to(node, { x: 0, duration: 0.08 })
          break
      }

      if (animation) loopAnimations.set(node, animation)
    }

    function restartLoopAnimation(node, loop, rotation) {
      stopLoopAnimation(node)
      gsap.set(node, { x: 0, y: 0, scale: 1, rotation, clearProps: 'filter' })
      playLoopAnimation(node, loop)
    }

    function playExitAnimation(node, config, onComplete) {
      const exit = config?.exit || {}
      const duration = exit.duration || 0.5
      const delay = exit.delay || 0
      const ease = exit.ease || 'power2.in'
      stopLoopAnimation(node)
      gsap.killTweensOf(node)
      const complete = onComplete || (() => {})

      switch (exit.type) {
        case 'fadeOut': return gsap.to(node, { opacity: 0, duration, delay, ease, onComplete: complete })
        case 'slideUp': return gsap.to(node, { y: '-=60', opacity: 0, duration, delay, ease, onComplete: complete })
        case 'slideDown': return gsap.to(node, { y: '+=60', opacity: 0, duration, delay, ease, onComplete: complete })
        case 'slideLeft': return gsap.to(node, { x: '-=80', opacity: 0, duration, delay, ease, onComplete: complete })
        case 'slideRight': return gsap.to(node, { x: '+=80', opacity: 0, duration, delay, ease, onComplete: complete })
        case 'zoomOut': return gsap.to(node, { scale: 0.3, opacity: 0, duration, delay, ease: 'back.in(1.7)', onComplete: complete })
        case 'bounceOut': return gsap.to(node, { y: '-=80', scale: 0.8, opacity: 0, duration, delay, ease: 'power2.in', onComplete: complete })
        case 'flipX': return gsap.to(node, { rotationX: -90, opacity: 0, duration, delay, ease, onComplete: complete })
        default: complete()
      }
    }

    function formatBoundValue(value, format) {
      if (value === undefined || value === null || value === '') return ''
      if (format === 'number') {
        const numeric = Number(value)
        return Number.isFinite(numeric) ? new Intl.NumberFormat().format(numeric) : String(value)
      }
      if (format === 'uppercase') return String(value).toUpperCase()
      if (format === 'lowercase') return String(value).toLowerCase()
      return String(value)
    }

    function resolveElementText(el) {
      const binding = el?.textBinding
      const fallback = binding?.fallback || el?.style?.text || ''
      if (!binding?.enabled) return el?.style?.text || fallback

      let rawValue
      if (binding.source === 'external') {
        rawValue = getValueAtPath(getExternalSourceSnapshot(binding.externalSourceId)?.data, binding.fieldPath)
      } else {
        rawValue = liveStats?.[binding.field]
      }

      const formatted = formatBoundValue(rawValue, binding.format || 'raw')
      const value = formatted || fallback
      return `${binding.prefix || ''}${value}${binding.suffix || ''}`
    }

    function applyElement(node, el) {
      node.style.left = `${el.x}px`
      node.style.top = `${el.y}px`
      node.style.width = `${el.width}px`
      node.style.height = `${el.height}px`
      node.style.zIndex = el.zIndex || 1
      node.style.opacity = el.opacity !== undefined ? el.opacity : 1
      node.style.borderRadius = `${el.style?.borderRadius || 0}px`
      node.style.borderWidth = `${el.style?.borderWidth || 0}px`
      node.style.borderStyle = el.style?.borderStyle || (el.style?.borderWidth ? 'solid' : 'none')
      node.style.borderColor = el.style?.borderColor || 'transparent'

      if (el.style?.gradient?.enabled) {
        const from = el.style.gradient.from || '#0f172a'
        const to = el.style.gradient.to || '#020617'
        node.style.background = `linear-gradient(${el.style.gradient.angle || 90}deg, ${from}, ${to})`
      } else {
        node.style.background = 'none'
        node.style.backgroundColor = el.style?.backgroundColor || 'transparent'
      }

      if (el.style?.shadowColor) {
        node.style.boxShadow = `${el.style.shadowOffsetX || 0}px ${el.style.shadowOffsetY || 4}px ${el.style.shadowBlur || 16}px ${el.style.shadowColor}`
      } else {
        node.style.boxShadow = 'none'
      }

      if (el.type === 'image' && el.src) {
        let image = node.querySelector('img[data-asset-image]')
        if (!image) {
          node.replaceChildren()
          image = document.createElement('img')
          image.dataset.assetImage = 'true'
          image.draggable = false
          node.appendChild(image)
        }
        image.src = el.src
        image.alt = el.name || 'Image asset'
        image.style.width = '100%'
        image.style.height = '100%'
        image.style.display = 'block'
        image.style.objectFit = el.objectFit || 'contain'
      } else if (el.type === 'text' || el.style?.text !== undefined) {
        let textEl = node.firstElementChild
        if (!textEl) {
          textEl = document.createElement('div')
          node.appendChild(textEl)
        }
        textEl.style.width = '100%'
        textEl.style.height = '100%'
        textEl.style.display = 'flex'
        textEl.style.alignItems = 'center'
        textEl.style.fontFamily = el.style?.fontFamily || 'Inter, sans-serif'
        textEl.style.fontSize = `${el.style?.fontSize || 18}px`
        textEl.style.fontWeight = el.style?.fontWeight || 'normal'
        textEl.style.color = el.style?.color || '#ffffff'
        textEl.style.padding = `${el.style?.padding || 0}px`
        textEl.style.textAlign = el.style?.textAlign || 'left'
        textEl.style.textTransform = el.style?.textTransform || 'none'
        textEl.style.letterSpacing = `${el.style?.letterSpacing || 0}px`
        textEl.style.justifyContent = el.style?.textAlign === 'center' ? 'center' : (el.style?.textAlign === 'right' ? 'flex-end' : 'flex-start')
        textEl.textContent = resolveElementText(el)
      } else {
        node.replaceChildren()
      }
    }

    function playEntranceAnimation(node, config) {
      const entrance = config?.entrance || {}
      const duration = entrance.duration || 0.8
      const delay = entrance.delay || 0
      const ease = entrance.ease || 'power3.out'
      const finish = () => {
        const latestConfig = renderedElements.get(node.dataset.elementId)?.config || config
        playLoopAnimation(node, latestConfig?.loop || {})
      }
      const options = { opacity: 0, duration, delay, ease, onComplete: finish }

      switch (entrance.type) {
        case 'fadeIn': return gsap.from(node, options)
        case 'slideUp': return gsap.from(node, { ...options, y: '+=60' })
        case 'slideDown': return gsap.from(node, { ...options, y: '-=60' })
        case 'slideLeft': return gsap.from(node, { ...options, x: '+=80' })
        case 'slideRight': return gsap.from(node, { ...options, x: '-=80' })
        case 'zoomIn': return gsap.from(node, { ...options, scale: 0.3, ease: 'back.out(1.7)' })
        case 'bounceIn': return gsap.from(node, { ...options, y: '+=100', scale: 0.8, ease: 'bounce.out' })
        case 'flipX': return gsap.from(node, { ...options, rotationX: 90 })
        case 'elasticIn': return gsap.from(node, { ...options, scale: 0.1, ease: 'elastic.out(1, 0.4)' })
        default: finish()
      }
    }

    function renderScene(scene) {
      if (!scene || !scene.elements) return
      scaleViewport()
      const visibleElements = scene.elements.filter(el => !el.hidden)
      const visibleIds = new Set(visibleElements.map(el => el.id))

      renderedElements.forEach(({ node, config }, id) => {
        if (visibleIds.has(id)) return
        renderedElements.delete(id)
        playExitAnimation(node, config, () => node.remove())
      })

      visibleElements.sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0)).forEach(el => {
        const existing = renderedElements.get(el.id)
        if (existing) {
          applyElement(existing.node, el)
          const nextLoop = el.animation?.loop || {}
          const loopChanged = JSON.stringify(existing.config?.loop || {}) !== JSON.stringify(nextLoop)
          const rotation = el.rotation || 0
          const rotationChanged = existing.rotation !== rotation

          if (loopChanged || (rotationChanged && nextLoop.type === 'swing')) {
            restartLoopAnimation(existing.node, nextLoop, rotation)
          } else if (nextLoop.type !== 'swing') {
            gsap.set(existing.node, { rotation })
          }

          existing.config = el.animation
          existing.rotation = rotation
          return
        }

        const div = document.createElement('div')
        div.className = 'overlay-element'
        div.id = `render-el-${el.id}`
        div.dataset.elementId = el.id
        applyElement(div, el)
        gsap.set(div, { rotation: el.rotation || 0, transformPerspective: 800 })
        viewport.appendChild(div)
        renderedElements.set(el.id, { node: div, config: el.animation, rotation: el.rotation || 0 })
        playEntranceAnimation(div, el.animation)
      })
    }

    async function syncScene(isInitial = false) {
      try {
        const res = await fetch(`/api/scenes/${encodeURIComponent(overlaySceneId)}`)
        if (res.ok) {
          const text = await res.text()
          if (text !== lastSceneHash || isInitial) {
            lastSceneHash = text
            currentScene = JSON.parse(text)
            renderScene(currentScene)
          }
        }
      } catch (err) {
        console.error('Failed to sync scene:', err)
      }
    }

    async function syncLiveStats(isInitial = false) {
      try {
        const res = await fetch('/api/live-stats')
        if (!res.ok) return
        const text = await res.text()
        if (text !== lastLiveStatsHash || isInitial) {
          lastLiveStatsHash = text
          liveStats = JSON.parse(text)
          if (currentScene) renderScene(currentScene)
        }
      } catch (err) {
        console.error('Failed to sync live stats:', err)
      }
    }

    async function syncExternalData(isInitial = false) {
      try {
        const res = await fetch('/api/external-data')
        if (!res.ok) return
        const text = await res.text()
        if (text !== lastExternalDataHash || isInitial) {
          lastExternalDataHash = text
          externalData = JSON.parse(text)
          if (currentScene) renderScene(currentScene)
        }
      } catch (err) {
        console.error('Failed to sync external data:', err)
      }
    }

    window.addEventListener('resize', scaleViewport)

    document.addEventListener('DOMContentLoaded', () => {
      scaleViewport()
      syncLiveStats(true)
      syncExternalData(true)
      syncScene(true)
      setInterval(() => syncScene(false), 2000)
      setInterval(() => syncLiveStats(false), 2000)
      setInterval(() => syncExternalData(false), 5000)
    })
  </script>
</body>
</html>
