<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveOverlay - Stream Overlay Renderer</title>
  <!-- Google Fonts for Stream Overlays -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      color: #ffffff;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #overlay-viewport {
      position: relative;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      overflow: hidden;
    }
    .overlay-element {
      position: absolute;
      box-sizing: border-box;
      overflow: hidden;
      transition: all 0.2s ease-out;
    }
  </style>
</head>
<body>
  <div id="overlay-viewport">
    <!-- Dynamic Scene Elements Injected Here -->
  </div>

  <script>
    const viewport = document.getElementById('overlay-viewport')
    let lastSceneHash = ''

    function scaleViewport() {
      const windowW = window.innerWidth
      const windowH = window.innerHeight
      if (windowW !== 1920 || windowH !== 1080) {
        const scaleX = windowW / 1920
        const scaleY = windowH / 1080
        const scale = Math.min(scaleX, scaleY)
        viewport.style.transform = `scale(${scale})`
      } else {
        viewport.style.transform = 'none'
      }
    }

    function renderScene(scene) {
      viewport.innerHTML = ''
      if (!scene || !scene.elements) return

      const sortedElements = [...scene.elements].sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0))

      sortedElements.forEach(el => {
        if (el.hidden) return // Do not render hidden elements on live stream

        const div = document.createElement('div')
        div.className = 'overlay-element'
        div.id = `render-el-${el.id}`
        div.style.left = `${el.x}px`
        div.style.top = `${el.y}px`
        div.style.width = `${el.width}px`
        div.style.height = `${el.height}px`
        div.style.zIndex = el.zIndex || 1
        div.style.opacity = el.opacity !== undefined ? el.opacity : 1
        div.style.transform = `rotate(${el.rotation || 0}deg)`
        div.style.borderRadius = `${el.style?.borderRadius || 0}px`
        div.style.borderWidth = `${el.style?.borderWidth || 0}px`
        div.style.borderStyle = el.style?.borderStyle || (el.style?.borderWidth ? 'solid' : 'none')
        div.style.borderColor = el.style?.borderColor || 'transparent'

        // Fill & Gradients
        if (el.style?.gradient?.enabled) {
          const from = el.style.gradient.from || '#0f172a'
          const to = el.style.gradient.to || '#020617'
          const angle = el.style.gradient.angle || 90
          div.style.background = `linear-gradient(${angle}deg, ${from}, ${to})`
        } else {
          div.style.backgroundColor = el.style?.backgroundColor || 'transparent'
        }

        // Shadows
        if (el.style?.shadowColor) {
          const sx = el.style.shadowOffsetX || 0
          const sy = el.style.shadowOffsetY || 4
          const sb = el.style.shadowBlur || 16
          div.style.boxShadow = `${sx}px ${sy}px ${sb}px ${el.style.shadowColor}`
        }

        // Typography
        if (el.type === 'text' || el.style?.text !== undefined) {
          const textEl = document.createElement('div')
          textEl.style.width = '100%'
          textEl.style.height = '100%'
          textEl.style.display = 'flex'
          textEl.style.alignItems = 'center'
          textEl.style.fontFamily = el.style?.fontFamily || 'Inter, sans-serif'
          textEl.style.fontSize = `${el.style?.fontSize || 18}px`
          textEl.style.fontWeight = el.style?.fontWeight || 'normal'
          textEl.style.color = el.style?.color || '#ffffff'
          textEl.style.padding = `${el.style?.padding || 0}px`
          textEl.style.textAlign = el.style?.textAlign || 'left'
          textEl.style.textTransform = el.style?.textTransform || 'none'
          textEl.style.letterSpacing = `${el.style?.letterSpacing || 0}px`
          textEl.style.justifyContent = el.style?.textAlign === 'center' ? 'center' : (el.style?.textAlign === 'right' ? 'flex-end' : 'flex-start')
          textEl.textContent = el.style?.text || ''
          div.appendChild(textEl)
        }

        viewport.appendChild(div)
      })
    }

    async function syncScene() {
      try {
        const res = await fetch('/api/scene')
        if (res.ok) {
          const text = await res.text()
          if (text !== lastSceneHash) {
            lastSceneHash = text
            const scene = JSON.parse(text)
            renderScene(scene)
          }
        }
      } catch (err) {
        console.error('Failed to sync scene:', err)
      }
    }

    window.addEventListener('resize', scaleViewport)

    document.addEventListener('DOMContentLoaded', () => {
      scaleViewport()
      syncScene()
      setInterval(syncScene, 2000)
    })
  </script>
</body>
</html>
