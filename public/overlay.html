<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveOverlay - Stream Source</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body {
      background: transparent !important;
      color: white;
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen p-8 flex flex-col justify-end items-start antialiased font-sans select-none">
  <!-- Overlay Widget Container -->
  <div id="overlay-container" class="opacity-0 translate-y-8 flex flex-col gap-3 max-w-xl">
    
    <!-- Header: TikTok Username Badge -->
    <div id="username-badge" class="inline-flex items-center gap-2.5 px-4 py-2 rounded-2xl bg-black/60 backdrop-blur-md border border-white/10 shadow-2xl">
      <!-- TikTok Icon -->
      <svg class="w-4 h-4 text-pink-500 fill-current" viewBox="0 0 24 24">
        <path d="M12.53.02C13.84 0 15.14.01 16.44 0c.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.24 1.07-.14 1.61.24 1.17 1.17 2.12 2.34 2.37.94.21 1.96.07 2.77-.47.66-.43 1.13-1.1 1.33-1.85.11-.47.16-.95.16-1.43V.02h.01z"/>
      </svg>
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-300">TikTok:</span>
      <span id="tiktok-display" class="font-bold text-sm bg-gradient-to-r from-pink-400 via-rose-300 to-indigo-300 bg-clip-text text-transparent">
        @creator
      </span>
    </div>

    <!-- Running Text Box -->
    <div id="text-banner" class="flex items-center gap-3 px-5 py-3.5 rounded-2xl bg-black/75 backdrop-blur-xl border border-white/15 shadow-2xl">
      <div class="flex h-2.5 w-2.5 relative">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-indigo-500"></span>
      </div>
      <p id="running-text-display" class="text-sm font-medium text-white tracking-wide leading-snug">
        Loading overlay stream data...
      </p>
    </div>

  </div>

  <script>
    let currentSettings = { tiktokUsername: '', runningText: '' }

    const container = document.getElementById('overlay-container')
    const tiktokDisplay = document.getElementById('tiktok-display')
    const runningTextDisplay = document.getElementById('running-text-display')

    function applyEntranceAnimation() {
      gsap.killTweensOf(['#overlay-container', '#username-badge', '#text-banner'])
      
      const tl = gsap.timeline()
      tl.to(container, {
        opacity: 1,
        y: 0,
        duration: 0.8,
        ease: 'power3.out'
      })
      .from('#username-badge', {
        scale: 0.85,
        opacity: 0,
        duration: 0.6,
        ease: 'back.out(1.7)'
      }, '-=0.4')
      .from('#text-banner', {
        x: -30,
        opacity: 0,
        duration: 0.7,
        ease: 'power2.out'
      }, '-=0.3')
    }

    async function fetchSettings(isInitial = false) {
      try {
        const res = await fetch('/api/settings')
        if (res.ok) {
          const data = await res.json()
          
          // Check if data changed
          const changed = data.tiktokUsername !== currentSettings.tiktokUsername || 
                          data.runningText !== currentSettings.runningText

          if (changed || isInitial) {
            currentSettings = data
            tiktokDisplay.textContent = data.tiktokUsername || '@creator'
            runningTextDisplay.textContent = data.runningText || 'Welcome to stream!'
            
            if (isInitial) {
              applyEntranceAnimation()
            } else {
              // Smooth transition on update
              gsap.fromTo('#text-banner', 
                { scale: 0.96, opacity: 0.7 }, 
                { scale: 1, opacity: 1, duration: 0.4, ease: 'power2.out' }
              )
            }
          }
        }
      } catch (err) {
        console.error('Failed to load settings:', err)
      }
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', () => {
      fetchSettings(true)
      // Poll every 3 seconds for dynamic live updates from GUI
      setInterval(() => fetchSettings(false), 3000)
    })
  </script>
</body>
</html>
